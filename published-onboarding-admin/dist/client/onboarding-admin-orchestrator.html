      if (moduleIndex === 0) {
        return `
          &lt;div class=&quot;oa-form-grid&quot;&gt;
            &lt;label class=&quot;form-label&quot;&gt;功能名称&lt;input class=&quot;form-control&quot; data-module-field=&quot;title&quot; value=&quot;${config.title}&quot;&gt;&lt;/label&gt;
            &lt;div&gt;&lt;/div&gt;
            &lt;label class=&quot;form-label oa-span-2&quot;&gt;功能简介&lt;textarea class=&quot;form-control&quot; data-module-field=&quot;intro&quot; rows=&quot;2&quot;&gt;${config.intro}&lt;/textarea&gt;&lt;/label&gt;
            &lt;label class=&quot;form-label&quot;&gt;1:1 功能主图&lt;input class=&quot;form-control&quot; type=&quot;file&quot; accept=&quot;image/png,image/jpeg,image/webp&quot; data-crop-ratio=&quot;1:1&quot; data-module-file&gt;&lt;span class=&quot;text-muted oa-crop-feedback&quot;&gt;${config.mediaName ? `已选择：${config.mediaName}` : '选择图片后自动校验比例。'}&lt;/span&gt;&lt;/label&gt;
            ${optionalActionForm(config, moduleIndex)}
          &lt;/div&gt;`;
      }
      if (moduleIndex === 1) {
        const blocks = Array.isArray(config.blocks) &amp;&amp; config.blocks.length
          ? config.blocks
          : [defaultGuideContentBlock(feature)];
        return `
          &lt;div class=&quot;oa-form-grid&quot;&gt;
            &lt;label class=&quot;form-label oa-span-2&quot;&gt;功能指南标题&lt;input class=&quot;form-control&quot; data-module-field=&quot;title&quot; value=&quot;${config.title}&quot;&gt;&lt;/label&gt;
            &lt;div class=&quot;oa-guide-content-list&quot;&gt;
              ${blocks.map((block, blockIndex) =&gt; guideContentBlockForm(block, blockIndex, blocks.length)).join('')}
              &lt;button type=&quot;button&quot; class=&quot;btn oa-add-guide-content&quot; id=&quot;oa-add-guide-content&quot;&gt;＋ 继续添加引导内容&lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;`;
      }
      if (moduleIndex === 2) {
        return `
          &lt;div class=&quot;oa-form-grid&quot;&gt;
            &lt;label class=&quot;form-label&quot;&gt;画布卡片标题&lt;input class=&quot;form-control&quot; data-module-field=&quot;title&quot; value=&quot;${config.title}&quot;&gt;&lt;/label&gt;
            &lt;label class=&quot;form-label&quot;&gt;1:1 功能主图&lt;input class=&quot;form-control&quot; type=&quot;file&quot; accept=&quot;image/png,image/jpeg,image/webp&quot; data-crop-ratio=&quot;1:1&quot; data-module-file&gt;&lt;span class=&quot;text-muted oa-crop-feedback&quot;&gt;${config.mediaName ? `已选择：${config.mediaName}` : '选择图片后自动校验比例。'}&lt;/span&gt;&lt;/label&gt;
            &lt;label class=&quot;form-label oa-span-2&quot;&gt;画布卡片简介&lt;textarea class=&quot;form-control&quot; data-module-field=&quot;intro&quot; rows=&quot;2&quot;&gt;${config.intro}&lt;/textarea&gt;&lt;/label&gt;
            ${optionalActionForm(config, moduleIndex)}
          &lt;/div&gt;`;
      }
      return `
        &lt;div class=&quot;oa-form-grid&quot;&gt;
          &lt;div class=&quot;oa-guide-content-list&quot;&gt;
            ${(config.anchors || [defaultMarkerAnchor(feature)]).map((item, anchorIndex) =&gt; `
              &lt;article class=&quot;oa-guide-content-card&quot;&gt;
                &lt;div class=&quot;oa-section-head&quot;&gt;
                  &lt;div class=&quot;viz-row&quot;&gt;&lt;span class=&quot;oa-guide-content-index&quot;&gt;${anchorIndex + 1}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;位置锚点 ${anchorIndex + 1}&lt;/strong&gt;&lt;p class=&quot;text-muted&quot;&gt;在一个真实产品入口展示红点或 NEW 标签。&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
                  &lt;button type=&quot;button&quot; class=&quot;btn text-destructive&quot; data-remove-marker-anchor=&quot;${anchorIndex}&quot; ${(config.anchors || []).length === 1 ? 'disabled title=&quot;至少保留一个位置锚点&quot;' : ''}&gt;删除锚点&lt;/button&gt;
                &lt;/div&gt;
                &lt;div class=&quot;oa-form-grid&quot;&gt;
                  &lt;label class=&quot;form-label&quot;&gt;产品位置锚点&lt;select class=&quot;form-select&quot; data-marker-anchor-index=&quot;${anchorIndex}&quot; data-marker-anchor-field=&quot;anchor&quot;&gt;${markerAnchorOptions(feature).map(option =&gt; `&lt;option ${item.anchor === option ? 'selected' : ''}&gt;${option}&lt;/option&gt;`).join('')}&lt;/select&gt;&lt;/label&gt;
                  &lt;label class=&quot;form-label&quot;&gt;引导样式&lt;select class=&quot;form-select&quot; data-marker-anchor-index=&quot;${anchorIndex}&quot; data-marker-anchor-field=&quot;style&quot;&gt;&lt;option ${item.style === 'NEW 标签' ? 'selected' : ''}&gt;NEW 标签&lt;/option&gt;&lt;option ${item.style === '红点' ? 'selected' : ''}&gt;红点&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
                &lt;/div&gt;
              &lt;/article&gt;
            `).join('')}
            &lt;button type=&quot;button&quot; class=&quot;btn oa-add-guide-content&quot; id=&quot;oa-add-marker-anchor&quot; ${(config.anchors || []).length &gt;= markerAnchorOptions(feature).length ? 'disabled title=&quot;所有可选位置均已配置&quot;' : ''}&gt;＋ 添加位置锚点&lt;/button&gt;
            &lt;span class=&quot;text-muted&quot;&gt;每个位置仅可配置一次，最多配置 ${markerAnchorOptions(feature).length} 个位置锚点。&lt;/span&gt;
          &lt;/div&gt;
          &lt;label class=&quot;form-label oa-span-2&quot;&gt;统一消失条件&lt;select class=&quot;form-select&quot; data-module-field=&quot;dismiss&quot;&gt;&lt;option ${config.dismiss === '首次成功后消失' ? 'selected' : ''}&gt;首次成功后消失&lt;/option&gt;&lt;option ${config.dismiss === '首次点击后消失' ? 'selected' : ''}&gt;首次点击后消失&lt;/option&gt;&lt;option ${config.dismiss === '活动到期后消失' ? 'selected' : ''}&gt;活动到期后消失&lt;/option&gt;&lt;/select&gt;&lt;span class=&quot;text-muted&quot;&gt;达到条件后，本功能的全部红点与 NEW 标签统一消失。&lt;/span&gt;&lt;/label&gt;
        &lt;/div&gt;`;
    }

    function saveFeatureBaseFromForm() {
      const feature = ensureFeatureMeta(featureData[selectedFeature]);
      const previousName = feature.name;
      const previousIntro = feature.intro;
      feature.name = root.querySelector('#oa-feature-name').value;
      feature.key = root.querySelector('#oa-feature-key').value;
      feature.intro = root.querySelector('#oa-feature-intro').value;
      feature.owner = root.querySelector('#oa-feature-owner').value;
      feature.event = root.querySelector('#oa-feature-event').value;
      feature.moduleConfigs.forEach(config =&gt; {
        if (config.title === previousName) config.title = feature.name;
        if (config.title === `${previousName}：完整能力指南`) config.title = `${feature.name}：完整能力指南`;
        if (config.intro === previousIntro) config.intro = feature.intro;
        if (config.actionName === `打开并定位 ${previousName}`) config.actionName = `打开并定位 ${feature.name}`;
      });
      feature.updated = '刚刚';
      return feature;
    }

    function saveCurrentFeatureModuleForm(moduleIndex) {
      const feature = ensureFeatureMeta(featureData[selectedFeature]);
      const section = root.querySelector(`[data-module-config-section=&quot;${moduleIndex}&quot;]`);
      if (!section) return false;
      const config = cloneEditorData(feature.moduleConfigs[moduleIndex] || {});
      section.querySelectorAll('[data-module-field]').forEach(input =&gt; {
        config[input.dataset.moduleField] = input.value;
      });
      if (moduleIndex === 1) {
        config.blocks = Array.isArray(config.blocks) ? config.blocks : [];
        section.querySelectorAll('[data-guide-block-field]').forEach(input =&gt; {
          const blockIndex = Number(input.dataset.guideBlockIndex);
          config.blocks[blockIndex] = config.blocks[blockIndex] || defaultGuideContentBlock(feature, blockIndex);
          config.blocks[blockIndex][input.dataset.guideBlockField] = input.value;
        });
        section.querySelectorAll('[data-guide-block-file]').forEach(input =&gt; {
          const blockIndex = Number(input.dataset.guideBlockFile);
          if (input.files?.[0]) {
            config.blocks[blockIndex].mediaName = input.dataset.croppedName || input.files[0].name;
          }
        });
        const unverifiedMedia = [...section.querySelectorAll('[data-guide-block-file]')]
          .find(input =&gt; input.files?.[0] &amp;&amp; input.dataset.cropValid !== 'true');
        if (unverifiedMedia) {
          showToast('请等待媒体比例校验完成，并完成必要的 16:9 裁切');
          return false;
        }
        if (!String(config.title || '').trim() || !config.blocks.length) {
          showToast('请填写功能指南标题并至少添加一个引导内容');
          return false;
        }
        const invalidBlockIndex = config.blocks.findIndex(block =&gt;
          !String(block.subtitle || '').trim() ||
          !String(block.mediaName || '').trim() ||
          !String(block.detail || '').trim() ||
          String(block.detail || '').length &gt; 200
        );
        if (invalidBlockIndex &gt;= 0) {
          showToast(`请完成引导内容 ${invalidBlockIndex + 1} 的子标题、16:9 媒体和不超过 200 字的引导详情`);
          return false;
        }
        const invalidActionIndex = config.blocks.findIndex(block =&gt;
          block.actionEnabled &amp;&amp; (
            !String(block.actionName || '').trim() ||
            !String(block.actionUrl || '').trim() ||
            !/^(\/|https:\/\/)/.test(String(block.actionUrl || '').trim())
          )
        );
        if (invalidActionIndex &gt;= 0) {
          showToast(`请完整填写引导内容 ${invalidActionIndex + 1} 的动作文案和有效链接，或删除动作`);
          return false;
        }
        feature.moduleConfigs[moduleIndex] = config;
        setModuleState(feature, moduleIndex, 'completed');
        return true;
      }
      if (moduleIndex === 3) {
        config.anchors = [];
        section.querySelectorAll('[data-marker-anchor-field]').forEach(input =&gt; {
          const anchorIndex = Number(input.dataset.markerAnchorIndex);
          config.anchors[anchorIndex] = config.anchors[anchorIndex] || defaultMarkerAnchor(feature, anchorIndex);
          config.anchors[anchorIndex][input.dataset.markerAnchorField] = input.value;
        });
        if (!config.anchors.length || config.anchors.some(item =&gt; !String(item.anchor || '').trim() || !String(item.style || '').trim())) {
          showToast('请至少配置一个完整的位置锚点');
          return false;
        }
        const anchorNames = config.anchors.map(item =&gt; item.anchor);
        if (new Set(anchorNames).size !== anchorNames.length) {
          showToast('同一个产品位置只能配置一次，请选择不同的位置锚点');
          return false;
        }
        if (!String(config.dismiss || '').trim()) {
          showToast('请选择红点引导的统一消失条件');
          return false;
        }
        feature.moduleConfigs[moduleIndex] = config;
        setModuleState(feature, moduleIndex, 'completed');
        return true;
      }
      const fileInput = section.querySelector('[data-module-file]');
      if (fileInput?.files?.[0]) {
        config.mediaName = fileInput.dataset.croppedName || fileInput.files[0].name;
      }
      const optionalActionKeys = new Set(['mediaName', 'actionEnabled', 'actionName', 'actionUrl']);
      const requiredValues = Object.entries(config).filter(([key]) =&gt; !optionalActionKeys.has(key));
      if (requiredValues.some(([, value]) =&gt; !String(value || '').trim())) {
        showToast('请完成当前引导形式的必填内容');
        return false;
      }
      if (config.actionEnabled &amp;&amp; (!String(config.actionName || '').trim() || !String(config.actionUrl || '').trim())) {
        showToast('请完整填写跳转动作名称和跳转链接，或删除跳转动作');
        return false;
      }
      if (config.actionEnabled &amp;&amp; !/^(\/|https:\/\/)/.test(String(config.actionUrl).trim())) {
        showToast('跳转链接需使用站内路径 /... 或 https:// 完整链接');
        return false;
      }
      feature.moduleConfigs[moduleIndex] = config;
      setModuleState(feature, moduleIndex, 'completed');
      return true;
    }

    function validateAllEnabledFeatureModules() {
      const feature = ensureFeatureMeta(featureData[selectedFeature]);
      const selectedIndexes = feature.selectedChannels
        .map((selected, index) =&gt; selected ? index : -1)
        .filter(index =&gt; index &gt;= 0);
      if (!selectedIndexes.length) {
        showToast('请至少开启一种引导形式');
        return false;
      }
      for (const moduleIndex of selectedIndexes) {
        selectedFeatureModule = moduleIndex;
        if (!saveCurrentFeatureModuleForm(moduleIndex)) {
          setModuleState(feature, moduleIndex, 'pending');
          root.querySelector(`[data-module-config-section=&quot;${moduleIndex}&quot;]`)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
          return false;
        }
      }
      feature.updated = '刚刚';
      markEditorDirty('feature');
      return true;
    }

    function validateFeatureBase() {
      const feature = saveFeatureBaseFromForm();
      const missing = [];
      if (!feature.name.trim()) missing.push('功能名称');
      if (!feature.key.trim()) missing.push('功能标识');
      if (!feature.owner.trim()) missing.push('产品负责人');
      if (!feature.intro.trim()) missing.push('功能简介');
      if (!feature.event || feature.event === '未配置') missing.push('首次成功事件');
      if (missing.length) {
        showToast(`请先完成：${missing.join('、')}`);
        return false;
      }
      return true;
    }

    function renderFeatureReview() {
      const feature = ensureFeatureMeta(featureData[selectedFeature]);
      const selectedIndexes = feature.selectedChannels
        .map((selected, index) =&gt; selected ? index : -1)
        .filter(index =&gt; index &gt;= 0);
      const previewIndexes = featurePreviewModule === null
        ? selectedIndexes
        : selectedIndexes.filter(index =&gt; index === featurePreviewModule);
      const isFullReview = featurePreviewModule === null;
      root.querySelector('#oa-feature-module-panel').hidden = false;
      root.querySelector('#oa-feature-module-panel').innerHTML = `
        &lt;div class=&quot;oa-feature-review&quot;&gt;
          &lt;div class=&quot;oa-section-head&quot;&gt;
            &lt;div&gt;&lt;strong&gt;${isFullReview ? (feature.confirmed ? '预览本次母版变更' : '预览并确认功能') : `预览${guideTypeCatalog[featurePreviewModule].label}`}&lt;/strong&gt;&lt;p class=&quot;text-muted&quot;&gt;${isFullReview ? '核对基础信息、每种引导的展示效果、跳转行为与触发规则。' : '这是该引导形式的独立预览，不会在此保存母版。'}&lt;/p&gt;&lt;/div&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;oa-return-feature-config&quot;&gt;返回配置&lt;/button&gt;
          &lt;/div&gt;
          ${isFullReview ? `
            &lt;div class=&quot;oa-release-line&quot;&gt;
              &lt;div&gt;&lt;span class=&quot;text-muted&quot;&gt;功能名称&lt;/span&gt;&lt;strong&gt;${feature.name}&lt;/strong&gt;&lt;/div&gt;
              &lt;div&gt;&lt;span class=&quot;text-muted&quot;&gt;功能标识&lt;/span&gt;&lt;strong&gt;${feature.key}&lt;/strong&gt;&lt;/div&gt;
              &lt;div&gt;&lt;span class=&quot;text-muted&quot;&gt;产品负责人&lt;/span&gt;&lt;strong&gt;${feature.owner}&lt;/strong&gt;&lt;/div&gt;
              &lt;div&gt;&lt;span class=&quot;text-muted&quot;&gt;首次成功事件&lt;/span&gt;&lt;strong&gt;${feature.event}&lt;/strong&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;oa-sync-note&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;功能简介&lt;/span&gt;&lt;span&gt;${feature.intro}&lt;/span&gt;&lt;/div&gt;
          ` : ''}
          &lt;div class=&quot;oa-feature-review-grid&quot;&gt;
            ${previewIndexes.map(index =&gt; `
              &lt;article class=&quot;oa-feature-preview-card&quot;&gt;
                &lt;div class=&quot;oa-section-head&quot;&gt;&lt;strong&gt;${guideTypeCatalog[index].label}&lt;/strong&gt;&lt;span class=&quot;viz-badge&quot;&gt;已完成&lt;/span&gt;&lt;/div&gt;
                &lt;div class=&quot;oa-feature-preview-visual&quot;&gt;${guideTypeCatalog[index].preview}&lt;/div&gt;
                &lt;strong&gt;${feature.moduleConfigs[index]?.title || feature.name}&lt;/strong&gt;
                ${index === 1 ? `
                  &lt;div class=&quot;oa-readonly-module-list&quot;&gt;
                    ${(feature.moduleConfigs[index]?.blocks || []).map((block, blockIndex) =&gt; `
                      &lt;div class=&quot;oa-module-status-card&quot;&gt;
                        &lt;div class=&quot;oa-section-head&quot;&gt;&lt;strong&gt;${blockIndex + 1}. ${block.subtitle}&lt;/strong&gt;&lt;span class=&quot;viz-badge&quot;&gt;16:9 媒体&lt;/span&gt;&lt;/div&gt;
                        &lt;span class=&quot;text-muted&quot;&gt;${block.detail}&lt;/span&gt;
                        &lt;span class=&quot;text-muted&quot;&gt;媒体：${block.mediaName || '未选择'}&lt;/span&gt;
                        &lt;span class=&quot;text-muted&quot;&gt;动作：${block.actionEnabled ? `${block.actionName} → ${block.actionUrl}` : '未配置，仅展示内容'}&lt;/span&gt;
                      &lt;/div&gt;
                    `).join('')}
                  &lt;/div&gt;
                ` : index === 3 ? `
                  &lt;div class=&quot;oa-readonly-module-list&quot;&gt;
                    ${(feature.moduleConfigs[index]?.anchors || []).map((item, anchorIndex) =&gt; `
                      &lt;div class=&quot;oa-module-status-card&quot;&gt;
                        &lt;div class=&quot;oa-section-head&quot;&gt;&lt;strong&gt;${anchorIndex + 1}. ${item.anchor}&lt;/strong&gt;&lt;span class=&quot;viz-badge&quot;&gt;${item.style}&lt;/span&gt;&lt;/div&gt;
                      &lt;/div&gt;
                    `).join('')}
                  &lt;/div&gt;
                  &lt;span class=&quot;text-muted&quot;&gt;不配置跳转动作；仅在对应产品入口展示引导标记。&lt;/span&gt;
                ` : `
                  &lt;span class=&quot;text-muted&quot;&gt;${feature.moduleConfigs[index]?.intro || feature.intro}&lt;/span&gt;
                  &lt;span class=&quot;text-muted&quot;&gt;跳转动作：${feature.moduleConfigs[index]?.actionEnabled ? `${feature.moduleConfigs[index].actionName} → ${feature.moduleConfigs[index].actionUrl}` : '未配置，仅展示内容'}&lt;/span&gt;
                `}
                &lt;span class=&quot;text-muted&quot;&gt;触发与结束：${index === 3 ? feature.moduleConfigs[index]?.dismiss : `进入${guideTypeCatalog[index].preview}时触发；收到 ${feature.event} 后停止后续触达`}&lt;/span&gt;
              &lt;/article&gt;
            `).join('')}
          &lt;/div&gt;
        &lt;/div&gt;`;
      root.querySelector('#oa-return-feature-config').addEventListener('click', () =&gt; {
        featureReviewMode = false;
        featurePreviewModule = null;
        renderFeatureStep();
      });
    }

    function renderFeatureModules() {
      const feature = ensureFeatureMeta(featureData[selectedFeature]);
      const selectedIndexes = feature.selectedChannels
        .map((selected, index) =&gt; selected ? index : -1)
        .filter(index =&gt; index &gt;= 0);
      const completedCount = selectedIndexes.filter(index =&gt; getModuleState(feature, index) === 'completed').length;
      const invalidCount = selectedIndexes.filter(index =&gt; getModuleState(feature, index) === 'invalid').length;
      root.querySelector('#oa-feature-module-progress').textContent = `已选择 ${selectedIndexes.length} 种 · ${completedCount} 种已完成${invalidCount ? ` · ${invalidCount} 种异常` : ''}`;
      root.querySelector('#oa-guide-type-grid').innerHTML = '';
      root.querySelector('#oa-feature-module-manager-list').innerHTML = guideTypeCatalog.map((item, moduleIndex) =&gt; {
        const selected = Boolean(feature.selectedChannels[moduleIndex]);
        const state = getModuleState(feature, moduleIndex);
        const status = selected ? moduleStatusMeta[state] : null;
        return `
          &lt;div class=&quot;oa-feature-manager-row ${selected ? 'is-enabled' : ''}&quot;&gt;
            &lt;div class=&quot;oa-feature-manager-copy&quot;&gt;
              &lt;span class=&quot;oa-manager-icon&quot; aria-hidden=&quot;true&quot;&gt;◇&lt;/span&gt;
              &lt;div&gt;&lt;strong&gt;${item.label}&lt;/strong&gt;&lt;small&gt;${selected ? status.label : '未开启'}&lt;/small&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;label class=&quot;oa-module-switch&quot;&gt;
              &lt;input type=&quot;checkbox&quot; data-toggle-feature-module=&quot;${moduleIndex}&quot; ${selected ? 'checked' : ''} aria-label=&quot;开启${item.label}&quot;&gt;
              &lt;span aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;
            &lt;/label&gt;
          &lt;/div&gt;`;
      }).join('');

      if (featureReviewMode) {
        renderFeatureReview();
      } else if (!selectedIndexes.length) {
        root.querySelector('#oa-feature-module-panel').hidden = true;
        root.querySelector('#oa-feature-module-panel').innerHTML = '';
      } else {
        root.querySelector('#oa-feature-module-panel').hidden = false;
        root.querySelector('#oa-feature-module-panel').innerHTML = `
          &lt;div class=&quot;oa-module-config-stack&quot;&gt;
            ${selectedIndexes.map(moduleIndex =&gt; {
              const state = getModuleState(feature, moduleIndex);
              const status = moduleStatusMeta[state];
              return `
                &lt;section class=&quot;oa-module-config-section&quot; data-module-config-section=&quot;${moduleIndex}&quot;&gt;
                  &lt;div class=&quot;oa-section-head&quot;&gt;
                    &lt;div&gt;&lt;strong&gt;${channelLabels[moduleIndex]}配置&lt;/strong&gt;&lt;p class=&quot;text-muted&quot;&gt;填写完成后统一预览和保存，无需单独提交该板块。&lt;/p&gt;&lt;/div&gt;
                    &lt;span class=&quot;viz-badge ${status.className}&quot;&gt;${status.label}&lt;/span&gt;
                  &lt;/div&gt;
                  ${featureModuleForm(feature, moduleIndex)}
                &lt;/section&gt;`;
            }).join('')}
          &lt;/div&gt;`;
      }

      root.querySelectorAll('[data-toggle-feature-module]').forEach(input =&gt; {
        input.addEventListener('change', () =&gt; {
          const moduleIndex = Number(input.dataset.toggleFeatureModule);
          feature.selectedChannels[moduleIndex] = input.checked ? 1 : 0;
          setModuleState(feature, moduleIndex, 'pending');
          if (input.checked) selectedFeatureModule = moduleIndex;
          featureReviewMode = false;
          featurePreviewModule = null;
          markEditorDirty('feature');
          renderFeatureStep();
          showToast(input.checked ? `${channelLabels[moduleIndex]}已开启，请完成配置` : `${channelLabels[moduleIndex]}已关闭，对应配置已隐藏`);
        });
      });
      const addGuideContentButton = root.querySelector('#oa-add-guide-content');
      if (addGuideContentButton) {
        addGuideContentButton.addEventListener('click', () =&gt; {
          const config = feature.moduleConfigs[1];
          config.blocks = Array.isArray(config.blocks) ? config.blocks : [];
          config.blocks.push(defaultGuideContentBlock(feature, config.blocks.length));
          setModuleState(feature, 1, 'pending');
          markEditorDirty('feature');
          renderFeatureStep();
          showToast(`已添加引导内容 ${config.blocks.length}`);
        });
      }
      const addMarkerAnchorButton = root.querySelector('#oa-add-marker-anchor');
      if (addMarkerAnchorButton) {
        addMarkerAnchorButton.addEventListener('click', () =&gt; {
          const section = root.querySelector('[data-module-config-section=&quot;3&quot;]');
          const config = feature.moduleConfigs[3];
          config.anchors = Array.isArray(config.anchors) ? config.anchors : [];
          section?.querySelectorAll('[data-marker-anchor-field]').forEach(input =&gt; {
            const anchorIndex = Number(input.dataset.markerAnchorIndex);
            config.anchors[anchorIndex] = config.anchors[anchorIndex] || defaultMarkerAnchor(feature, anchorIndex);
            config.anchors[anchorIndex][input.dataset.markerAnchorField] = input.value;
          });
          const dismissInput = section?.querySelector('[data-module-field=&quot;dismiss&quot;]');
          if (dismissInput) config.dismiss = dismissInput.value;
          const usedAnchors = new Set(config.anchors.map(item =&gt; item.anchor));
          const nextAnchor = markerAnchorOptions(feature).find(option =&gt; !usedAnchors.has(option));
          if (!nextAnchor) {
            showToast('所有可选位置均已配置');
            return;
          }
          config.anchors.push({ anchor: nextAnchor, style: '红点' });
          setModuleState(feature, 3, 'pending');
          markEditorDirty('feature');
          renderFeatureStep();
          showToast(`已添加位置锚点 ${config.anchors.length}`);
        });
      }
      root.querySelectorAll('[data-remove-marker-anchor]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          const section = root.querySelector('[data-module-config-section=&quot;3&quot;]');
          const config = feature.moduleConfigs[3];
          if (!Array.isArray(config.anchors) || config.anchors.length &lt;= 1) {
            showToast('红点引导至少保留一个位置锚点');
            return;
          }
          section?.querySelectorAll('[data-marker-anchor-field]').forEach(input =&gt; {
            const itemIndex = Number(input.dataset.markerAnchorIndex);
            config.anchors[itemIndex] = config.anchors[itemIndex] || defaultMarkerAnchor(feature, itemIndex);
            config.anchors[itemIndex][input.dataset.markerAnchorField] = input.value;
          });
          const dismissInput = section?.querySelector('[data-module-field=&quot;dismiss&quot;]');
          if (dismissInput) config.dismiss = dismissInput.value;
          const anchorIndex = Number(button.dataset.removeMarkerAnchor);
          config.anchors.splice(anchorIndex, 1);
          setModuleState(feature, 3, 'pending');
          markEditorDirty('feature');
          renderFeatureStep();
          showToast('位置锚点已删除');
        });
      });
      root.querySelectorAll('[data-remove-guide-content]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          const config = feature.moduleConfigs[1];
          if (!Array.isArray(config.blocks) || config.blocks.length &lt;= 1) {
            showToast('功能指南至少保留一个引导内容');
            return;
          }
          const blockIndex = Number(button.dataset.removeGuideContent);
          config.blocks.splice(blockIndex, 1);
          setModuleState(feature, 1, 'pending');
          markEditorDirty('feature');
          renderFeatureStep();
          showToast('引导内容已删除');
        });
      });
      root.querySelectorAll('[data-add-guide-block-action]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          const blockIndex = Number(button.dataset.addGuideBlockAction);
          const block = feature.moduleConfigs[1].blocks[blockIndex];
          block.actionEnabled = true;
          block.actionName = block.actionName || '立即体验';
          block.actionUrl = block.actionUrl || `/canvas?tool=${feature.key}`;
          setModuleState(feature, 1, 'pending');
          markEditorDirty('feature');
          renderFeatureStep();
          showToast(`已为引导内容 ${blockIndex + 1} 添加动作`);
        });
      });
      root.querySelectorAll('[data-remove-guide-block-action]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          const blockIndex = Number(button.dataset.removeGuideBlockAction);
          const block = feature.moduleConfigs[1].blocks[blockIndex];
          block.actionEnabled = false;
          block.actionName = '';
          block.actionUrl = '';
          setModuleState(feature, 1, 'pending');
          markEditorDirty('feature');
          renderFeatureStep();
          showToast(`引导内容 ${blockIndex + 1} 已移除动作`);
        });
      });
      root.querySelectorAll('[data-add-module-action]').forEach(addActionButton =&gt; {
        addActionButton.addEventListener('click', () =&gt; {
          const moduleIndex = Number(addActionButton.dataset.addModuleAction);
          const config = feature.moduleConfigs[moduleIndex];
          config.actionEnabled = true;
          setModuleState(feature, moduleIndex, 'pending');
          markEditorDirty('feature');
          renderFeatureStep();
          showToast('已添加可选跳转动作，请填写动作名称和跳转链接');
        });
      });
      root.querySelectorAll('[data-remove-module-action]').forEach(removeActionButton =&gt; {
        removeActionButton.addEventListener('click', () =&gt; {
          const moduleIndex = Number(removeActionButton.dataset.removeModuleAction);
          const config = feature.moduleConfigs[moduleIndex];
          config.actionEnabled = false;
          config.actionName = '';
          config.actionUrl = '';
          setModuleState(feature, moduleIndex, 'pending');
          markEditorDirty('feature');
          renderFeatureStep();
          showToast('已删除跳转动作；保存后该引导仅展示内容');
        });
      });
    }

    function getChannelFeature(channel, featureIndex) {
      return {
        ...featureData[featureIndex],
        ...(channelOverrides[channel][featureIndex] || {})
      };
    }

    function selectedFeaturesEditor(channel) {
      const selection = channelSelections[channel];
      const rows = selection.map((featureIndex, position) =&gt; {
        const feature = getChannelFeature(channel, featureIndex);
        const hasOverride = Boolean(channelOverrides[channel][featureIndex]);
        return `
          &lt;div class=&quot;oa-selected-row&quot;&gt;
            &lt;span class=&quot;oa-order&quot;&gt;${position + 1}&lt;/span&gt;
            &lt;div class=&quot;oa-selected-copy&quot;&gt;
              &lt;strong&gt;${feature.name}&lt;/strong&gt;
              &lt;span class=&quot;text-muted&quot;&gt;${feature.intro}&lt;/span&gt;
              &lt;span class=&quot;text-muted&quot;&gt;${hasOverride ? '渠道内容已覆盖' : '跟随功能母版'} · ${feature.url || '/canvas?feature=' + featureIndex}&lt;/span&gt;
            &lt;/div&gt;
            &lt;div class=&quot;oa-row-actions&quot;&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-move-feature=&quot;${position}&quot; data-direction=&quot;-1&quot; ${position === 0 ? 'disabled' : ''}&gt;上移&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-move-feature=&quot;${position}&quot; data-direction=&quot;1&quot; ${position === selection.length - 1 ? 'disabled' : ''}&gt;下移&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-edit-selection=&quot;${position}&quot;&gt;编辑&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-remove-selection=&quot;${position}&quot;&gt;移除&lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;`;
      }).join('');

      let editor = '';
      if (editingSelection &amp;&amp; editingSelection.channel === channel) {
        const featureIndex = selection[editingSelection.position];
        const feature = getChannelFeature(channel, featureIndex);
        editor = `
          &lt;div class=&quot;oa-channel-override&quot;&gt;
            &lt;div class=&quot;oa-section-head&quot;&gt;
              &lt;div&gt;&lt;strong&gt;编辑渠道展示 · ${feature.name}&lt;/strong&gt;&lt;p class=&quot;text-muted&quot;&gt;只覆盖当前渠道，不修改功能母版。&lt;/p&gt;&lt;/div&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; id=&quot;oa-close-override&quot;&gt;收起&lt;/button&gt;
            &lt;/div&gt;
            &lt;div class=&quot;oa-form-grid&quot;&gt;
              &lt;label class=&quot;form-label&quot;&gt;展示名称&lt;input class=&quot;form-control&quot; data-override-field=&quot;name&quot; value=&quot;${feature.name}&quot;&gt;&lt;/label&gt;
              ${channel === 'home' ? `&lt;label class=&quot;form-label&quot;&gt;按钮文案&lt;input class=&quot;form-control&quot; data-override-field=&quot;actionLabel&quot; value=&quot;${feature.actionLabel || '去尝试'}&quot;&gt;&lt;/label&gt;` : ''}
              &lt;label class=&quot;form-label oa-span-2&quot;&gt;展示简介&lt;textarea class=&quot;form-control&quot; data-override-field=&quot;intro&quot; rows=&quot;2&quot;&gt;${feature.intro}&lt;/textarea&gt;&lt;/label&gt;
              &lt;label class=&quot;form-label oa-span-2&quot;&gt;跳转链接&lt;input class=&quot;form-control&quot; data-override-field=&quot;url&quot; value=&quot;${feature.url || '/canvas?feature=' + featureIndex}&quot; placeholder=&quot;粘贴站内路径或 https:// 链接&quot;&gt;&lt;/label&gt;
            &lt;/div&gt;
            &lt;div class=&quot;viz-row&quot;&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;oa-save-override&quot;&gt;保存渠道编辑&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;oa-reset-override&quot;&gt;恢复跟随母版&lt;/button&gt;
            &lt;/div&gt;
          &lt;/div&gt;`;
      }

      return `
        &lt;div class=&quot;oa-selection-head&quot;&gt;
          &lt;div&gt;&lt;strong&gt;推送功能&lt;/strong&gt; &lt;span class=&quot;viz-badge&quot;&gt;已选 ${selection.length} / 6&lt;/span&gt;&lt;/div&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-open-picker=&quot;${channel}&quot;&gt;＋ 选择功能&lt;/button&gt;
        &lt;/div&gt;
        &lt;div class=&quot;oa-selected-list&quot;&gt;${rows}&lt;/div&gt;
        ${editor}
      `;
    }

    function channelFormHome() {
      return `
        &lt;div class=&quot;oa-section-head&quot;&gt;
          &lt;div&gt;&lt;strong&gt;首页推送弹窗&lt;/strong&gt;&lt;p class=&quot;text-muted&quot;&gt;版本级内容 + 单次选择 1—6 个推送功能。&lt;/p&gt;&lt;/div&gt;
          &lt;label class=&quot;form-check form-switch&quot;&gt;
            &lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; checked&gt;
            &lt;span class=&quot;form-check-label&quot;&gt;启用&lt;/span&gt;
          &lt;/label&gt;
        &lt;/div&gt;
        &lt;div class=&quot;oa-form-grid&quot;&gt;
          &lt;label class=&quot;form-label oa-span-2&quot;&gt;版本更新主图 · 3:1&lt;input class=&quot;form-control&quot; type=&quot;file&quot; accept=&quot;image/*&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label oa-span-2&quot;&gt;推送主标题&lt;input class=&quot;form-control&quot; value=&quot;欢迎来到更强大的创作工作台&quot;&gt;&lt;/label&gt;
          &lt;label class=&quot;form-label oa-span-2&quot;&gt;推送副标题&lt;textarea class=&quot;form-control&quot; rows=&quot;2&quot;&gt;四个主能力带动全套创作升级，每项功能都可直接开始。&lt;/textarea&gt;&lt;/label&gt;
        &lt;/div&gt;
        ${selectedFeaturesEditor('home')}
      `;

    function channelFormGuide() {
      const blocks = guideBlockData.map((block, index) =&gt; `
        &lt;div class=&quot;oa-guide-block-config&quot;&gt;
          &lt;div class=&quot;oa-guide-block-head&quot;&gt;
            &lt;div&gt;&lt;span class=&quot;viz-badge&quot;&gt;板块 ${index + 1}&lt;/span&gt; &lt;strong&gt;${block.title}&lt;/strong&gt;&lt;/div&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-delete-block=&quot;${index}&quot;&gt;删除板块&lt;/button&gt;
          &lt;/div&gt;
          &lt;div class=&quot;oa-form-grid&quot;&gt;
            &lt;label class=&quot;form-label&quot;&gt;媒体类型
              &lt;select class=&quot;form-select&quot; data-block-type=&quot;${index}&quot;&gt;
                &lt;option value=&quot;image&quot; ${block.type === 'image' ? 'selected' : ''}&gt;图片&lt;/option&gt;
                &lt;option value=&quot;video&quot; ${block.type === 'video' ? 'selected' : ''}&gt;视频&lt;/option&gt;
              &lt;/select&gt;
            &lt;/label&gt;
            &lt;div class=&quot;oa-ratio-preview&quot;&gt;${block.type === 'video' ? '▶ 视频预览' : '▧ 图片预览'} · 16:9&lt;/div&gt;
            &lt;label class=&quot;form-label oa-span-2&quot;&gt;从本地选择 ${block.type === 'video' ? '视频' : '图片'}
              &lt;input class=&quot;form-control&quot; type=&quot;file&quot; data-block-file=&quot;${index}&quot; accept=&quot;${block.type === 'video' ? 'video/mp4,video/webm' : 'image/png,image/jpeg,image/webp'}&quot;&gt;

    function renderChannel() {
      const form = root.querySelector('#oa-channel-form');
      const formRenderers = {
        home: releaseReviewHome,
        guide: releaseReviewGuide,
        canvas: releaseReviewCanvas,
        markers: releaseReviewMarkers
      };
      form.innerHTML = formRenderers[activeChannel]();
      root.querySelector('#oa-preview-caption').textContent = channelMeta[activeChannel].caption;
      root.querySelectorAll('[data-channel]').forEach(button =&gt; {
        const active = button.dataset.channel === activeChannel;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-selected', String(active));
      });

      form.querySelectorAll('[data-open-picker]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; openFeaturePicker(button.dataset.openPicker));
      });

      form.querySelectorAll('[data-move-feature]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          const position = Number(button.dataset.moveFeature);
          const direction = Number(button.dataset.direction);
          const selection = channelSelections[activeChannel];
          const nextPosition = position + direction;
          [selection[position], selection[nextPosition]] = [selection[nextPosition], selection[position]];
          markEditorDirty('campaign');
          editingSelection = null;
          renderChannel();
        });
      });

      form.querySelectorAll('[data-edit-selection]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          editingSelection = { channel: activeChannel, position: Number(button.dataset.editSelection) };
          renderChannel();
        });
      });

      form.querySelectorAll('[data-remove-selection]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          const selection = channelSelections[activeChannel];
          if (selection.length === 1) {
            showToast('单次推送至少保留 1 个功能');
            return;
          }
          selection.splice(Number(button.dataset.removeSelection), 1);
          markEditorDirty('campaign');
          editingSelection = null;
          renderChannel();
          showToast('已从本渠道移除功能');
        });
      });

      const closeOverride = form.querySelector('#oa-close-override');
      if (closeOverride) {
        closeOverride.addEventListener('click', () =&gt; {
          editingSelection = null;
          renderChannel();
        });
      }

      const saveOverride = form.querySelector('#oa-save-override');
      if (saveOverride &amp;&amp; editingSelection) {
        saveOverride.addEventListener('click', () =&gt; {
          const featureIndex = channelSelections[editingSelection.channel][editingSelection.position];
          const override = {};
          form.querySelectorAll('[data-override-field]').forEach(input =&gt; {
            override[input.dataset.overrideField] = input.value;
          });
          channelOverrides[editingSelection.channel][featureIndex] = override;
          markEditorDirty('campaign');
          editingSelection = null;
          renderChannel();
          showToast('渠道展示内容已保存');
        });
      }

      const resetOverride = form.querySelector('#oa-reset-override');
      if (resetOverride &amp;&amp; editingSelection) {
        resetOverride.addEventListener('click', () =&gt; {
          const featureIndex = channelSelections[editingSelection.channel][editingSelection.position];
          delete channelOverrides[editingSelection.channel][featureIndex];
          markEditorDirty('campaign');
          editingSelection = null;
          renderChannel();
          showToast('已恢复跟随功能母版');
        });
      }

      const addBlock = form.querySelector('#oa-add-block');
      if (addBlock) {
        addBlock.addEventListener('click', () =&gt; {
          guideBlockData.push({
            type: 'image',
            file: '',
            title: `引导板块 ${guideBlockData.length + 1}`,
            content: '请输入该板块的引导内容。',
            ratio: '等待选择本地文件'
          });
          markEditorDirty('campaign');
          renderChannel();
          showToast(`已添加第 ${guideBlockData.length} 个引导板块`);
        });
      }

      form.querySelectorAll('[data-delete-block]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          guideBlockData.splice(Number(button.dataset.deleteBlock), 1);
          markEditorDirty('campaign');
          renderChannel();
          showToast('引导板块已删除');
        });
      });

      form.querySelectorAll('[data-block-type]').forEach(select =&gt; {
        select.addEventListener('change', () =&gt; {
          const index = Number(select.dataset.blockType);
          guideBlockData[index].type = select.value;
          guideBlockData[index].file = '';
          guideBlockData[index].ratio = '等待选择本地文件';
          renderChannel();
        });
      });

      form.querySelectorAll('[data-block-file]').forEach(input =&gt; {
        input.addEventListener('change', () =&gt; {
          const index = Number(input.dataset.blockFile);
          const file = input.files &amp;&amp; input.files[0];
          if (file) validateMediaFile(file, index);
        });
      });

      form.querySelectorAll('[data-clear-file]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          const index = Number(button.dataset.clearFile);
          guideBlockData[index].file = '';
          guideBlockData[index].ratio = '等待选择本地文件';
          markEditorDirty('campaign');
          renderChannel();
        });
      });

      form.querySelectorAll('[data-block-field]').forEach(input =&gt; {
        input.addEventListener('input', () =&gt; {
          const index = Number(input.dataset.blockIndex);
          guideBlockData[index][input.dataset.blockField] = input.value;
          renderPreview();
        });
      });

      form.querySelectorAll('[data-guide-action]').forEach(input =&gt; {
        input.addEventListener('input', () =&gt; {
          guideAction[input.dataset.guideAction] = input.value;
          renderPreview();
        });
        input.addEventListener('change', () =&gt; {
          guideAction[input.dataset.guideAction] = input.value;
          renderPreview();
        });
      });

      const deleteGuideAction = form.querySelector('#oa-delete-guide-action');
      if (deleteGuideAction) {
        deleteGuideAction.addEventListener('click', () =&gt; {
          guideAction.enabled = false;
          markEditorDirty('campaign');
          renderChannel();
          showToast('底部跳转动作已删除');
        });
      }

      const addGuideAction = form.querySelector('#oa-add-guide-action');
      if (addGuideAction) {
        addGuideAction.addEventListener('click', () =&gt; {
          guideAction.enabled = true;
          markEditorDirty('campaign');
          renderChannel();
        });
      }

      form.querySelectorAll('[data-marker]').forEach(input =&gt; {
        input.addEventListener('change', renderPreview);
      });
      form.querySelectorAll('[data-select-position]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; {
          button.textContent = '已绑定';
          button.classList.add('is-selected');
          markEditorDirty('campaign');
          showToast('已进入定位模式：选择产品入口后，将记录页面、控件和标签方位');
        });
      });
      renderPreview();
    }

    function validateMediaFile(file, index) {
      const block = guideBlockData[index];
      block.file = file.name;
      block.ratio = '正在检测比例…';
      const nameEl = root.querySelector(`[data-file-name=&quot;${index}&quot;]`);
      const statusEl = root.querySelector(`[data-ratio-status=&quot;${index}&quot;]`);
      if (nameEl) nameEl.textContent = `本地文件 · ${file.name}`;
      if (statusEl) statusEl.textContent = block.ratio;

      const objectUrl = URL.createObjectURL(file);
      const finish = (width, height) =&gt; {
        const ratio = width / height;
        const valid = Math.abs(ratio - 16 / 9) &lt;= 0.03;
        block.ratio = `${width} × ${height} · ${valid ? '16:9 校验通过' : '不符合 16:9'}`;
        const currentStatus = root.querySelector(`[data-ratio-status=&quot;${index}&quot;]`);
        if (currentStatus) {
          currentStatus.textContent = block.ratio;
          currentStatus.classList.toggle('text-destructive', !valid);
          currentStatus.classList.toggle('text-muted', valid);
        }
        URL.revokeObjectURL(objectUrl);
        renderPreview();
      };

      if (block.type === 'video') {
        const media = document.createElement('video');
        media.preload = 'metadata';
        media.onloadedmetadata = () =&gt; finish(media.videoWidth, media.videoHeight);
        media.onerror = () =&gt; finish(0, 1);
        media.src = objectUrl;
      } else {
        const media = new Image();
        media.onload = () =&gt; finish(media.naturalWidth, media.naturalHeight);
        media.onerror = () =&gt; finish(0, 1);
        media.src = objectUrl;
      }
    }

    function openFeaturePicker(channel) {
      pickerChannel = channel;
      pickerDraft = channel === 'campaign' ? [...campaignData[currentCampaign].features] : [...channelSelections[channel]];
      renderFeaturePicker();
      root.querySelector('#oa-feature-picker').hidden = false;
    }

    function renderFeaturePicker() {
      const maxReached = pickerDraft.length &gt;= 6;
      root.querySelector('#oa-picker-channel').textContent = channelMeta[pickerChannel].title;
      root.querySelector('#oa-picker-count').textContent = `已选 ${pickerDraft.length} / 6`;
      root.querySelector('#oa-confirm-picker').disabled = pickerDraft.length &lt; 1;
      const availableIndexes = pickerChannel === 'campaign'
        ? featureData.map((feature, index) =&gt; ensureFeatureMeta(feature).businessStatus === 'active' ? index : -1).filter(index =&gt; index &gt;= 0)
        : campaignData[currentCampaign].features;
      root.querySelector('#oa-picker-list').innerHTML = availableIndexes.map((index) =&gt; {
        const feature = ensureFeatureMeta(featureData[index]);
        const checked = pickerDraft.includes(index);
        const completedCount = feature.selectedChannels.filter((selected, moduleIndex) =&gt; selected &amp;&amp; getModuleState(feature, moduleIndex) === 'completed').length;
        const unavailable = feature.status !== 'online' || feature.businessStatus !== 'active' || completedCount === 0;
        return `
          &lt;div class=&quot;oa-picker-row&quot;&gt;
            &lt;label class=&quot;form-check&quot;&gt;
              &lt;input class=&quot;form-check-input&quot; type=&quot;checkbox&quot; data-picker-feature=&quot;${index}&quot; ${checked ? 'checked' : ''} ${!checked &amp;&amp; (maxReached || unavailable) ? 'disabled' : ''}&gt;
              &lt;span class=&quot;form-check-label&quot;&gt;&lt;strong&gt;${feature.name}&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;${feature.intro}&lt;/span&gt;&lt;/span&gt;
            &lt;/label&gt;
            &lt;span class=&quot;viz-badge&quot;&gt;${unavailable ? (feature.businessStatus !== 'active' ? featureBusinessStatusMeta[feature.businessStatus][0] : feature.status !== 'online' ? featureStatusMeta[feature.status][0] : '无已完成引导') : pickerChannel === 'campaign' ? `${completedCount} 种引导已完成` : getModuleState(feature, pickerChannel === 'home' ? 0 : 2) === 'completed' ? '配置已完成' : '本渠道未启用'}&lt;/span&gt;
          &lt;/div&gt;`;
      }).join('');

      root.querySelectorAll('[data-picker-feature]').forEach(input =&gt; {
        input.addEventListener('change', () =&gt; {
          const index = Number(input.dataset.pickerFeature);
          if (input.checked) {
            if (pickerDraft.length &lt; 6) pickerDraft.push(index);
          } else {
            pickerDraft = pickerDraft.filter(item =&gt; item !== index);
          }
          renderFeaturePicker();

    function trackEditorFieldMutation(event) {
      if (event.target.closest('#oa-scene-feature')) {
        markEditorDirty('feature');
        const guideBlockField = event.target.closest('[data-guide-block-field]');
        const guideBlockFile = event.target.closest('[data-guide-block-file]');
        const moduleField = event.target.closest('[data-module-field]');
        if (guideBlockField) {
          const feature = ensureFeatureMeta(featureData[selectedFeature]);
          const blockIndex = Number(guideBlockField.dataset.guideBlockIndex);
          const config = feature.moduleConfigs[1];
          config.blocks[blockIndex][guideBlockField.dataset.guideBlockField] = guideBlockField.value;
          setModuleState(feature, 1, 'pending');
          if (guideBlockField.dataset.guideBlockField === 'detail') updateFeatureCharCounter(guideBlockField);
        } else if (guideBlockFile) {
          const feature = ensureFeatureMeta(featureData[selectedFeature]);
          const blockIndex = Number(guideBlockFile.dataset.guideBlockFile);
          if (guideBlockFile.files?.[0]) {
            feature.moduleConfigs[1].blocks[blockIndex].mediaName =
              guideBlockFile.dataset.croppedName || guideBlockFile.files[0].name;
          }
          setModuleState(feature, 1, 'pending');
        } else if (moduleField) {
          const feature = ensureFeatureMeta(featureData[selectedFeature]);
          const moduleSection = moduleField.closest('[data-module-config-section]');
          const moduleIndex = Number(moduleSection?.dataset.moduleConfigSection);
          if (Number.isInteger(moduleIndex)) {
            feature.moduleConfigs[moduleIndex][moduleField.dataset.moduleField] = moduleField.value;
            setModuleState(feature, moduleIndex, 'pending');
          }
        } else if (event.target.closest('[data-module-file]')) {
          const moduleFile = event.target.closest('[data-module-file]');
          const moduleSection = moduleFile.closest('[data-module-config-section]');
          const moduleIndex = Number(moduleSection?.dataset.moduleConfigSection);
          if (Number.isInteger(moduleIndex)) {
            const feature = ensureFeatureMeta(featureData[selectedFeature]);
            if (moduleFile.files?.[0]) feature.moduleConfigs[moduleIndex].mediaName = moduleFile.dataset.croppedName || moduleFile.files[0].name;
            setModuleState(feature, moduleIndex, 'pending');
          }
        }
      } else if (
        event.target.closest('#oa-scene-overview') ||
        event.target.closest('#oa-scene-channels') ||
        event.target.closest('#oa-scene-publish')
      ) {
        markEditorDirty('campaign');
      }
    }

    const cropViewport = root.querySelector('#oa-crop-viewport');
    cropViewport.addEventListener('pointerdown', event =&gt; {
      if (!cropState) return;
      cropState.drag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        offsetX: cropState.offsetX,
        offsetY: cropState.offsetY
      };
      cropViewport.setPointerCapture(event.pointerId);
    });
    cropViewport.addEventListener('pointermove', event =&gt; {
      if (!cropState?.drag || cropState.drag.pointerId !== event.pointerId) return;
      cropState.offsetX = cropState.drag.offsetX + event.clientX - cropState.drag.startX;
      cropState.offsetY = cropState.drag.offsetY + event.clientY - cropState.drag.startY;
      applyCropTransform();
    });
    const finishCropDrag = event =&gt; {
      if (!cropState?.drag || cropState.drag.pointerId !== event.pointerId) return;
      cropState.drag = null;
      if (cropViewport.hasPointerCapture(event.pointerId)) {
        cropViewport.releasePointerCapture(event.pointerId);
      }
    };
    cropViewport.addEventListener('pointerup', finishCropDrag);
    cropViewport.addEventListener('pointercancel', finishCropDrag);
    root.querySelector('#oa-crop-zoom').addEventListener('input', event =&gt; {

      if (pickerChannel === 'campaign') {

        campaign.hasChanges = campaign.status === 'live' || campaign.hasChanges;
        ensureCampaignModuleSelections(campaign);

        renderCampaignFlow();

      }

    root.querySelectorAll('[data-feature-step]').forEach(button =&gt; {
      button.addEventListener('click', () =&gt; {
        const nextStep = Number(button.dataset.featureStep);
        if (nextStep === 2 &amp;&amp; !validateFeatureBase()) return;
        featureEditorStep = nextStep;

    root.querySelector('#oa-preview-feature').addEventListener('click', () =&gt; {

    });

    root.querySelector('#oa-add-feature').addEventListener('click', () =&gt; openFeaturePicker('campaign'));

    root.querySelector('#oa-save-feature').addEventListener('click', () =&gt; {
      if (!featureReviewMode) {
        if (!validateFeatureBase()) return;
        if (!validateAllEnabledFeatureModules()) return;
        featurePreviewModule = null;
        featureReviewMode = true;
        renderFeatureStep();
        showToast('已进入完整预览，请确认基础信息、引导内容、跳转行为与触发规则');
        return;
      }
      const feature = saveFeatureBaseFromForm();
      ensureFeatureMeta(feature);
      const selectedIndexes = feature.selectedChannels
        .map((selected, index) =&gt; selected ? index : -1)
        .filter(index =&gt; index &gt;= 0);
      if (!featureReviewMode || featurePreviewModule !== null) {
        showToast('请先完成“预览并确认”');
        return;
      }
      if (!selectedIndexes.length || !selectedIndexes.every(index =&gt; getModuleState(feature, index) === 'completed')) {
        showToast('请至少选择并完成一种引导形式');
        return;
      }
      const references = featureReferenceSummary(selectedFeature);
      const wasConfirmed = feature.confirmed;
      const previousVersion = wasConfirmed ? feature.version : 0;
      const nextVersion = wasConfirmed ? feature.version + 1 : 1;
      const previousFeature = editorSession?.snapshot || {};
      const previousSelections = previousFeature.selectedChannels || previousFeature.channels || [];
      const removedModules = guideTypeCatalog
        .filter((item, index) =&gt; previousSelections[index] &amp;&amp; !feature.selectedChannels[index])
        .map(item =&gt; item.label);
      const previousConfigs = previousFeature.moduleConfigs || [];
      const actionChanged = guideTypeCatalog.some((_, index) =&gt; {
        const before = previousConfigs[index] || {};
        const after = feature.moduleConfigs[index] || {};
        return JSON.stringify(moduleActionSignature(before)) !== JSON.stringify(moduleActionSignature(after));
      });
      const changedFields = [
        previousFeature.name !== feature.name ? '功能名称' : '',
        previousFeature.intro !== feature.intro ? '功能简介' : '',
        JSON.stringify(previousFeature.selectedChannels) !== JSON.stringify(feature.selectedChannels) ? '引导形式选择' : '',
        JSON.stringify(previousConfigs) !== JSON.stringify(feature.moduleConfigs) ? '引导形式内容' : '',
        actionChanged ? '跳转动作' : ''
      ].filter(Boolean);
      openConfirm({
        badge: wasConfirmed ? '保存并同步' : '确认创建',
        title: wasConfirmed ? '确认保存并同步？' : `确认创建“${feature.name}”？`,
        message: wasConfirmed
          ? `本次修改将把功能母版从 V${previousVersion} 更新为 V${nextVersion}，并按活动状态同步引用内容。已结束活动不会改变。`
          : '确认后将生成可使用的功能母版 V1，可被后续推送活动引用；未确认前不会保留创建内容。',
        impact: [
          `版本：${wasConfirmed ? `V${previousVersion} → V${nextVersion}` : '首次生成 V1'}；本次涉及 ${changedFields.length ? changedFields.join('、') : '引导内容确认'}`,
          `编辑中、未发布：${references.editing.length} 个活动，将自动同步最新母版`,
          `已排期、未开始：${references.scheduled.length} 个活动，将自动同步并标记“母版已更新”`,
          `进行中：${references.live.length} 个活动，默认锁定当前版本，由管理员决定是否应用`,
          `已结束或已下线：${references.frozen.length} 个活动，继续冻结历史快照`,
          `被同步或提示更新的活动：${[...references.editing, ...references.scheduled, ...references.live].map(item =&gt; item.name).join('、') || '无'}`,
          ...(removedModules.length || actionChanged ? [`高风险变更：${[removedModules.length ? `移除 ${removedModules.join('、')}` : '', actionChanged ? '新增、删除或修改跳转动作' : ''].filter(Boolean).join('；')}，已排期和进行中活动需重点确认`] : []),
          `审计记录：修改人 当前产品经理 · 修改时间 刚刚 · 母版版本 V${nextVersion} · 保留修改前后内容与活动列表`
        ],
        actionLabel: wasConfirmed ? '确认保存并同步' : '确认创建功能',
        onConfirm: () =&gt; {
          feature.version = nextVersion;
          feature.confirmed = true;
          feature.businessStatus = 'active';
          feature.updated = '刚刚';
          feature.revisions.unshift([
            '刚刚',
            '当前产品经理',
            `${wasConfirmed ? `由 V${previousVersion} 更新至 V${nextVersion}` : '创建母版 V1'}：${changedFields.length ? changedFields.join('、') : '完成首次确认'}`,
            {
              before: previousFeature,
              after: cloneEditorData(feature),
              activities: [...references.editing, ...references.scheduled, ...references.live].map(item =&gt; item.name)
            }
          ]);
          references.editing.forEach(campaign =&gt; {
            campaign.masterUpdated = false;
            campaign.revisions.unshift(['刚刚', '系统', `${feature.name} 已自动同步母版 V${nextVersion}`]);
          });
          references.scheduled.forEach(campaign =&gt; {
            campaign.masterUpdated = true;
            campaign.hasChanges = true;
            campaign.revisions.unshift(['刚刚', '系统', `${feature.name} 已同步母版 V${nextVersion}，发布前需重新确认`]);
          });
          references.live.forEach(campaign =&gt; {
            campaign.masterUpdated = true;
            campaign.revisions.unshift(['刚刚', '系统', `${feature.name} 母版已更新至 V${nextVersion}，当前活动仍锁定 V${previousVersion || 1}`]);
          });
          featureReviewMode = false;
          featurePreviewModule = null;
          commitEditorSession();
          renderFeatureEditor();
          renderFeatureLibrary();
          showToast(`功能母版 V${nextVersion} 已确认，活动已按生命周期规则处理`);
        }
      });
    });

    root.querySelector('#oa-cancel-feature').addEventListener('click', requestEditorClose);

    root.querySelector('#oa-delete-feature').addEventListener('click', () =&gt; requestFeatureDelete(selectedFeature));

    function saveCampaignDraft() {
      const campaign = campaignData[currentCampaign];
      campaign.name = root.querySelector('#oa-campaign-name').value || campaign.name;
      campaign.owner = root.querySelector('#oa-campaign-owner').value || campaign.owner;
      campaign.start = root.querySelector('#oa-campaign-start').value || campaign.start;
      campaign.end = root.querySelector('#oa-campaign-end').value || campaign.end;
      campaign.updated = '刚刚';
      if (campaign.status === 'live') campaign.hasChanges = true;
      setPageContext(activeTab);
    }

    root.querySelector('#oa-save').addEventListener('click', () =&gt; {
      saveCampaignDraft();
      commitEditorSession();
      showToast(campaignData[currentCampaign].status === 'live' ? '变更草稿已保存，线上版本未受影响' : '活动草稿已保存');
    });

    root.querySelector('#oa-publish').addEventListener('click', () =&gt; {
      saveCampaignDraft();
      const campaign = campaignData[currentCampaign];
      const isChange = campaign.status === 'live';
      openConfirm({
        badge: isChange ? '发布变更' : '发布活动',
        title: `${isChange ? '用新方案替换线上版本' : '发布'}“${campaign.name}”？`,
        message: isChange ? '发布成功后，新功能组合和触达内容将立即替换线上版本；系统会保留当前版本，可在变更记录中追溯。' : '活动将按当前时间、人群和频控规则生效。',
        impact: [
          `${campaign.features.length} 个功能：${campaign.features.map(index =&gt; featureData[index]?.name || '历史功能').join('、')}`,
          `${campaign.channelCount} 类引导组合`,
          `活动周期：${campaign.start} — ${campaign.end}`
        ],
        actionLabel: isChange ? '确认发布变更' : '确认发布',
        onConfirm: () =&gt; {
          campaign.status = 'live';
          campaign.hasChanges = false;
          campaign.masterUpdated = false;
          campaign.updated = '刚刚';
          campaign.revisions.unshift(['刚刚', '当前管理员', isChange ? '发布新版本并替换线上方案' : '活动正式发布']);
          setPageContext(activeTab);
          renderPublishForm();
          commitEditorSession();
          showToast(isChange ? '变更已发布，线上方案已更新' : '活动已发布');
        }
      });
    });

    root.querySelector('#oa-preview-journey').addEventListener('click', () =&gt; {
      journeyStep = 0;
      renderJourney();
      root.querySelector('#oa-journey').hidden = false;
    });
    root.querySelector('#oa-close-journey').addEventListener('click', () =&gt; {
      root.querySelector('#oa-journey').hidden = true;
    });
    root.querySelector('#oa-prev-step').addEventListener('click', () =&gt; {
      journeyStep = Math.max(0, journeyStep - 1);
      renderJourney();
    });
    root.querySelector('#oa-next-step').addEventListener('click', () =&gt; {
      if (journeyStep === journey.length - 1) {
        root.querySelector('#oa-journey').hidden = true;
      } else {
        journeyStep += 1;
        renderJourney();
      }
    });

    renderMatrix();
    renderFeatureEditor();
    renderChannel();
    switchTab(activeTab);
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  frame.srcdoc = srcdoc;
  delete frame.dataset.srcdoc;
})();
</script>
