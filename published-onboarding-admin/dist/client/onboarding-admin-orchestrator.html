.form-control:disabled,

}

.form-select {

  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {

  width: 14px;
  height: 14px;

  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

.form-check:not(.form-switch)

  background-color: var(--card);

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);

.form-check:not(.form-switch)

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

  height: 20px;

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;

  box-shadow: var(--shadow-sm);

  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input:checked {
  background: var(--primary);

.form-switch .form-check-input:checked::before {

  box-shadow: 0 0 0 2px var(--ring);

  border-color: var(--ring);

.form-range::-moz-range-track {

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;

      const feedback = input.closest('label')?.querySelector('.oa-crop-feedback');
      if (!feedback) return;

      feedback.classList.toggle('text-destructive', isError);
      feedback.classList.toggle('text-muted', !isError);
    }

    function syncGuideBlockMedia(input, mediaName) {
      if (input.dataset.guideBlockFile == null || !featureData[selectedFeature]) return;
      const feature = ensureFeatureMeta(featureData[selectedFeature]);
      const blockIndex = Number(input.dataset.guideBlockFile);
      const block = feature.moduleConfigs[1]?.blocks?.[blockIndex];
      if (!block) return;
      block.mediaName = mediaName;
      setModuleState(feature, 1, 'pending');
    }

    function clampCropOffsets() {
      if (!cropState) return;
      const viewport = root.querySelector('#oa-crop-viewport');
      const viewportWidth = viewport.clientWidth;
      const viewportHeight = viewport.clientHeight;
      if (!viewportWidth || !viewportHeight) return;
      const imageRatio = cropState.image.naturalWidth / cropState.image.naturalHeight;
      const viewportRatio = viewportWidth / viewportHeight;
      const baseWidth = imageRatio &gt; viewportRatio ? viewportHeight * imageRatio : viewportWidth;
      const baseHeight = imageRatio &gt; viewportRatio ? viewportHeight : viewportWidth / imageRatio;
      const maxX = Math.max(0, (baseWidth * cropState.zoom - viewportWidth) / 2);
      const maxY = Math.max(0, (baseHeight * cropState.zoom - viewportHeight) / 2);
      cropState.offsetX = Math.max(-maxX, Math.min(maxX, cropState.offsetX));
      cropState.offsetY = Math.max(-maxY, Math.min(maxY, cropState.offsetY));
    }

    function applyCropTransform() {
      if (!cropState) return;
      clampCropOffsets();
      root.querySelector('#oa-crop-image').style.transform =
        `translate3d(${cropState.offsetX}px, ${cropState.offsetY}px, 0) scale(${cropState.zoom})`;
    }

    function resetCropPosition() {
      if (!cropState) return;
      cropState.zoom = 1;
      cropState.offsetX = 0;
      cropState.offsetY = 0;
      root.querySelector('#oa-crop-zoom').value = '1';
      applyCropTransform();
    }

    function closeCropDialog({ clearInput = true } = {}) {
      if (!cropState) {
        root.querySelector('#oa-crop-dialog').hidden = true;
        return;
      }
      if (clearInput) {
        cropState.input.value = '';
        cropState.input.dataset.cropValid = 'false';
        syncGuideBlockMedia(cropState.input, '');
        setCropFeedback(cropState.input, `已取消裁切，请重新选择 ${cropState.config.label} 图片。`, true);
      }
      URL.revokeObjectURL(cropState.objectUrl);
      cropState = null;
      root.querySelector('#oa-crop-dialog').hidden = true;
      root.querySelector('#oa-crop-image').removeAttribute('src');
    }

    function openImageCrop(input, file, image, objectUrl, config) {
      if (cropState) closeCropDialog({ clearInput: false });
      cropState = {
        input,
        file,
        image,
        objectUrl,
        config,
        zoom: 1,
        offsetX: 0,
        offsetY: 0,
        drag: null
      };
      input.dataset.cropValid = 'false';
      root.querySelector('#oa-crop-badge').textContent = `${config.label} 图片裁切`;
      root.querySelector('#oa-crop-message').textContent =
        `原图 ${image.naturalWidth} × ${image.naturalHeight}，比例不符合 ${config.label}，请调整裁切区域。`;

        `${config.label} · ${config.width} × ${config.height}`;
      const viewport = root.querySelector('#oa-crop-viewport');
      viewport.style.aspectRatio = `${config.width} / ${config.height}`;

    }

    function inspectVideoRatio(input, file, config) {
      const objectUrl = URL.createObjectURL(file);
      const video = document.createElement('video');
      video.preload = 'metadata';
      video.onloadedmetadata = () =&gt; {
        const ratio = video.videoWidth / video.videoHeight;
        const valid = Math.abs(ratio - config.value) &lt;= 0.03;
        input.dataset.cropValid = String(valid);
        setCropFeedback(
          input,
          valid
            ? `${video.videoWidth} × ${video.videoHeight} · ${config.label} 校验通过`
            : `${video.videoWidth} × ${video.videoHeight} · 不符合 ${config.label}，视频不支持在线裁切。`,
          !valid
        );
        if (!valid) input.value = '';
        if (!valid) syncGuideBlockMedia(input, '');
        URL.revokeObjectURL(objectUrl);
        showToast(valid ? `${config.label} 视频比例校验通过` : `请重新上传 ${config.label} 视频`);
      };
      video.onerror = () =&gt; {
        input.value = '';
        input.dataset.cropValid = 'false';
        syncGuideBlockMedia(input, '');
        setCropFeedback(input, '无法读取视频尺寸，请重新选择文件。', true);
        URL.revokeObjectURL(objectUrl);
      };
      video.src = objectUrl;
    }

    function validateCropFile(input) {
      const file = input.files?.[0];
      if (!file) return;
      const config = cropRatioConfig(input.dataset.cropRatio);
      if (file.type.startsWith('video/')) {
        inspectVideoRatio(input, file, config);
        return;
      }
      if (!file.type.startsWith('image/')) {
        input.value = '';
        syncGuideBlockMedia(input, '');
        setCropFeedback(input, '不支持该文件格式，请重新选择。', true);
        return;
      }
      const objectUrl = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () =&gt; {
        const ratio = image.naturalWidth / image.naturalHeight;
        const valid = Math.abs(ratio - config.value) &lt;= 0.02;
        if (valid) {
          input.dataset.cropValid = 'true';
          setCropFeedback(
            input,
            `${image.naturalWidth} × ${image.naturalHeight} · ${config.label} 校验通过`
          );
          URL.revokeObjectURL(objectUrl);
          showToast(`${config.label} 图片比例校验通过`);
          return;
        }
        setCropFeedback(input, `比例不符合 ${config.label}，请完成裁切。`, true);
        openImageCrop(input, file, image, objectUrl, config);
      };
      image.onerror = () =&gt; {
        input.value = '';
        input.dataset.cropValid = 'false';
        syncGuideBlockMedia(input, '');
        setCropFeedback(input, '无法读取图片尺寸，请重新选择文件。', true);
        URL.revokeObjectURL(objectUrl);
      };
      image.src = objectUrl;
    }

    function applyImageCrop() {
      if (!cropState) return;
      const { image, config, input, file } = cropState;
      const viewport = root.querySelector('#oa-crop-viewport');
      const canvas = document.createElement('canvas');
      canvas.width = config.width;
      canvas.height = config.height;
      const context = canvas.getContext('2d');
      const coverScale = Math.max(
        config.width / image.naturalWidth,
        config.height / image.naturalHeight
      );
      const drawWidth = image.naturalWidth * coverScale * cropState.zoom;
      const drawHeight = image.naturalHeight * coverScale * cropState.zoom;
      const mappedOffsetX = cropState.offsetX / viewport.clientWidth * config.width;
      const mappedOffsetY = cropState.offsetY / viewport.clientHeight * config.height;
      context.drawImage(
        image,
        (config.width - drawWidth) / 2 + mappedOffsetX,
        (config.height - drawHeight) / 2 + mappedOffsetY,
        drawWidth,
        drawHeight
      );
      canvas.toBlob(blob =&gt; {
        if (!blob || !cropState) {
          showToast('裁切失败，请重试');
          return;
        }
        const baseName = file.name.replace(/\.[^.]+$/, '');
        const croppedFile = new File(
          [blob],
          `${baseName}-${config.label.replace(':', 'x')}.png`,
          { type: 'image/png' }
        );
        if (typeof DataTransfer !== 'undefined') {
          const transfer = new DataTransfer();
          transfer.items.add(croppedFile);
          input.files = transfer.files;
        }
        input.dataset.cropValid = 'true';
        input.dataset.croppedName = croppedFile.name;
        syncGuideBlockMedia(input, croppedFile.name);
        setCropFeedback(
          input,
          `${config.width} × ${config.height} · ${config.label} 裁切完成`
        );
        markEditorDirty('feature');
        closeCropDialog({ clearInput: false });
        showToast(`${config.label} 图片已裁切并替换原文件`);
      }, 'image/png', 0.92);
    }

    const featureStatusMeta = {
      online: ['已上线', ''],
      offline: ['已下线', 'text-muted'],
      draft: ['未同步', 'text-muted']
    };

    const featureBusinessStatusMeta = {
      creating: ['创建中', 'text-muted'],
      active: ['可使用', ''],
      disabled: ['已停用', 'text-muted']
    };

    const moduleStatusMeta = {
      unselected: { label: '未选择', action: '开始配置', className: 'text-muted' },
      pending: { label: '待配置', action: '开始配置', className: 'text-muted' },
      completed: { label: '已完成', action: '编辑', className: '' },
      invalid: { label: '配置异常', action: '修复配置', className: 'text-destructive' }
    };

    const campaignStatusMeta = {
      live: ['发布中', ''],
      scheduled: ['待发布', ''],
      draft: ['草稿', 'text-muted'],
      ended: ['已结束', 'text-muted'],
      offline: ['已下线', 'text-muted']
    };

    function campaignRefs(featureIndex) {
      return campaignData.filter(campaign =&gt; campaign.features.includes(featureIndex));
    }

    function defaultGuideContentBlock(feature, blockIndex = 0) {
      const actionEnabled = feature.confirmed !== false &amp;&amp; blockIndex === 0;
      return {
        subtitle: blockIndex === 0 ? '了解核心能力、使用方法和最佳实践。' : '',
        mediaName: feature.confirmed !== false ? `${feature.key}-guide-${blockIndex + 1}-16x9.png` : '',
        detail: blockIndex === 0 ? '通过图文或视频完整解释功能能力、操作方法与使用建议。' : '',
        actionEnabled,
        actionName: actionEnabled ? '立即体验' : '',
        actionUrl: actionEnabled ? (feature.url || `/canvas?tool=${feature.key}`) : ''
      };
    }

    function markerAnchorOptions(feature) {
      return [
        `左侧工具栏 / ${feature.key}`,
        '节点上方 Toolbar',
        '下方工具箱',
        '右侧智能助手'
      ];
    }

    function defaultMarkerAnchor(feature, anchorIndex = 0) {
      const options = markerAnchorOptions(feature);
      return {
        anchor: options[Math.min(anchorIndex, options.length - 1)],
        style: anchorIndex % 2 === 0 ? 'NEW 标签' : '红点'
      };
    }

    function defaultFeatureModuleConfig(feature, moduleIndex) {
      const actionEnabled = feature.confirmed !== false;
      const actionUrl = feature.url || `/canvas?tool=${feature.key}`;
      if (moduleIndex === 0) {
        return { title: feature.name, intro: feature.intro, mediaName: '', actionEnabled, actionName: '去尝试', actionUrl };
      }
      if (moduleIndex === 1) {
        return { title: `${feature.name}：完整能力指南`, blocks: [defaultGuideContentBlock(feature)] };
      }
      if (moduleIndex === 2) {
        return { title: feature.name, mediaName: '', intro: feature.intro, actionEnabled, actionName: '打开功能', actionUrl };
      }
      return { anchors: [defaultMarkerAnchor(feature)], dismiss: '首次成功后消失' };
    }

    function ensureFeatureMeta(feature) {
      if (!Array.isArray(feature.channels)) {
        feature.channels = guideTypeCatalog.map(() =&gt; 0);
      }
      if (!Array.isArray(feature.selectedChannels)) {
        feature.selectedChannels = feature.channels.map(Boolean);
      }
      if (!Array.isArray(feature.moduleStates)) {
        feature.moduleStates = feature.selectedChannels.map((selected, index) =&gt;
          selected ? (feature.channels[index] ? 'completed' : 'pending') : 'pending'
        );
      }
      if (!feature.version) feature.version = 1;
      if (feature.confirmed == null) feature.confirmed = true;
      if (!feature.businessStatus) {
        feature.businessStatus = feature.confirmed
          ? (feature.status === 'offline' ? 'disabled' : 'active')
          : 'creating';
      }
      if (!feature.url) feature.url = `/canvas?tool=${feature.key}`;
      if (!Array.isArray(feature.moduleConfigs)) {
        feature.moduleConfigs = guideTypeCatalog.map((_, index) =&gt; defaultFeatureModuleConfig(feature, index));
      }
      if (!Array.isArray(feature.moduleConfigs[1]?.blocks)) {
        const legacyGuide = feature.moduleConfigs[1] || {};
        feature.moduleConfigs[1] = {
          title: legacyGuide.title || `${feature.name}：完整能力指南`,
          blocks: [{
            ...defaultGuideContentBlock(feature),
            subtitle: legacyGuide.subtitle || '了解核心能力、使用方法和最佳实践。',
            mediaName: legacyGuide.mediaName || '',
            detail: legacyGuide.detail || '',
            actionEnabled: Boolean(legacyGuide.actionEnabled),
            actionName: legacyGuide.actionName || '',
            actionUrl: legacyGuide.actionUrl || ''
          }]
        };
      }
      const legacyMarker = feature.moduleConfigs[3] || {};
      if (!Array.isArray(legacyMarker.anchors) || !legacyMarker.anchors.length) {
        feature.moduleConfigs[3] = {
          anchors: [{
            anchor: legacyMarker.anchor || `左侧工具栏 / ${feature.key}`,
            style: legacyMarker.style || 'NEW 标签'
          }],
          dismiss: legacyMarker.dismiss || '首次成功后消失'
        };
      } else {
        feature.moduleConfigs[3] = {
          anchors: legacyMarker.anchors.map((item, index) =&gt; ({
            anchor: item.anchor || defaultMarkerAnchor(feature, index).anchor,
            style: item.style || 'NEW 标签'
          })),
          dismiss: legacyMarker.dismiss || '首次成功后消失'
        };
      }
      if (!Array.isArray(feature.revisions)) {
        feature.revisions = [[feature.updated, feature.owner, `确认功能母版 V${feature.version}`]];
      }
      return feature;
    }

    function getModuleState(feature, moduleIndex) {
      ensureFeatureMeta(feature);
      if (!feature.selectedChannels[moduleIndex]) return 'unselected';
      return feature.moduleStates[moduleIndex] || (feature.channels[moduleIndex] ? 'completed' : 'pending');
    }

    function setModuleState(feature, moduleIndex, state) {
      ensureFeatureMeta(feature);
      feature.moduleStates[moduleIndex] = state;
      feature.channels[moduleIndex] = state === 'completed' ? 1 : 0;
    }

    function moduleActionSignature(config = {}) {
      if (Array.isArray(config.blocks)) {
        return config.blocks.map(block =&gt; ({
          actionEnabled: Boolean(block.actionEnabled),
          actionName: block.actionName || '',
          actionUrl: block.actionUrl || ''
        }));
      }
      return {
        actionEnabled: Boolean(config.actionEnabled),
        actionName: config.actionName || '',
        actionUrl: config.actionUrl || ''
      };
    }

    function featureReferenceSummary(featureIndex) {
      const refs = campaignRefs(featureIndex);
      return {
        editing: refs.filter(item =&gt; item.status === 'draft'),
        scheduled: refs.filter(item =&gt; item.status === 'scheduled'),
        live: refs.filter(item =&gt; item.status === 'live'),
        frozen: refs.filter(item =&gt; ['ended', 'offline'].includes(item.status))
      };
    }

    function setPageContext(tab) {
      const isCampaignEditor = ['overview', 'channels', 'publish'].includes(tab);
      const isFeatureEditor = tab === 'feature';
      const campaign = campaignData[currentCampaign];
      root.querySelector('#oa-editor-actions').hidden = !isCampaignEditor;
      root.querySelector('#oa-editor-tabs').hidden = !isCampaignEditor;
      root.querySelector('#oa-close-editor').hidden = !(isCampaignEditor || isFeatureEditor);
      root.querySelector('#oa-context-header').hidden = !(isCampaignEditor || isFeatureEditor);
      root.querySelector('.oa-main-tabs').hidden = isCampaignEditor || isFeatureEditor;

      if (isCampaignEditor) {
        root.querySelector('#oa-page-title').textContent = campaign.name;
        root.querySelector('#oa-page-status').textContent = campaign.masterUpdated
          ? `${campaignStatusMeta[campaign.status][0]} · 母版已更新，待重新确认`
          : campaign.hasChanges &amp;&amp; campaign.status === 'live'
            ? '发布中 · 有待发布变更'
            : campaignStatusMeta[campaign.status][0];
        root.querySelector('#oa-check-publish').textContent = campaign.status === 'live' ? '检查并发布变更' : '检查并发布';
        root.querySelector('#oa-publish').textContent = campaign.status === 'live' ? '发布变更' : campaign.status === 'scheduled' ? '更新排期' : '发布活动';
        root.querySelector('#oa-change-banner').hidden = !(campaign.status === 'live');
      } else if (isFeatureEditor) {
        const feature = ensureFeatureMeta(featureData[selectedFeature]);
        const selectedCount = feature.selectedChannels.filter(Boolean).length;
        const completedCount = feature.selectedChannels.filter((selected, index) =&gt; selected &amp;&amp; getModuleState(feature, index) === 'completed').length;
        root.querySelector('#oa-page-title').textContent = feature.name;
        root.querySelector('#oa-page-status').textContent = `${featureBusinessStatusMeta[feature.businessStatus][0]}${feature.confirmed ? ` · 母版 V${feature.version}` : ''} · 已选择 ${selectedCount} 种 · ${completedCount} 种已完成`;
      } else {
        const pageTitles = {
          dashboard: ['功能引导管理', '统一管理'],
          library: ['平台功能', `${featureData.length} 个功能`],
          campaigns: ['推送活动', `${campaignData.length} 个活动`]
        };
        root.querySelector('#oa-page-title').textContent = pageTitles[tab][0];
        root.querySelector('#oa-page-status').textContent = pageTitles[tab][1];
      }
    }

    function cloneEditorData(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function captureCampaignEditorState(index) {
      return {
        campaign: cloneEditorData(campaignData[index]),
        channelSelections: cloneEditorData(channelSelections),
        channelOverrides: cloneEditorData(channelOverrides),
        guideBlockData: cloneEditorData(guideBlockData),
        guideAction: cloneEditorData(guideAction)
      };
    }

    function beginEditorSession(type, index, isNew = false) {
      editorSession = {
        type,
        index,
        isNew,
        dirty: false,
        snapshot: type === 'feature'
          ? cloneEditorData(featureData[index])
          : captureCampaignEditorState(index)
      };
    }

    function markEditorDirty(type) {
      if (editorSession &amp;&amp; editorSession.type === type) {
        editorSession.dirty = true;
      }
    }

    function commitEditorSession() {
      if (!editorSession) return;
      editorSession.isNew = false;
      editorSession.dirty = false;
      editorSession.snapshot = editorSession.type === 'feature'
        ? cloneEditorData(featureData[editorSession.index])
        : captureCampaignEditorState(editorSession.index);
    }

    function restoreCampaignEditorState(snapshot, index) {
      campaignData[index] = cloneEditorData(snapshot.campaign);
      channelSelections.home = [...snapshot.channelSelections.home];
      channelSelections.canvas = [...snapshot.channelSelections.canvas];
      channelOverrides.home = cloneEditorData(snapshot.channelOverrides.home || {});
      channelOverrides.canvas = cloneEditorData(snapshot.channelOverrides.canvas || {});
      guideBlockData.splice(0, guideBlockData.length, ...cloneEditorData(snapshot.guideBlockData));
      Object.keys(guideAction).forEach(key =&gt; delete guideAction[key]);
      Object.assign(guideAction, cloneEditorData(snapshot.guideAction));
    }

    function removeUnsavedFeature(index) {
      featureData.splice(index, 1);
      campaignData.forEach(campaign =&gt; {
        campaign.features = campaign.features.map(featureIndex =&gt; featureIndex &gt; index ? featureIndex - 1 : featureIndex);
      });
      channelSelections.home = channelSelections.home.map(featureIndex =&gt; featureIndex &gt; index ? featureIndex - 1 : featureIndex);
      channelSelections.canvas = channelSelections.canvas.map(featureIndex =&gt; featureIndex &gt; index ? featureIndex - 1 : featureIndex);
    }

    function discardEditorSession() {
      if (!editorSession) return;
      const session = editorSession;
      if (session.type === 'feature') {
        if (session.isNew) {
          removeUnsavedFeature(session.index);
        } else if (session.dirty) {
          featureData[session.index] = cloneEditorData(session.snapshot);
        }
        selectedFeature = Math.max(0, Math.min(session.index, featureData.length - 1));
      } else {
        if (session.isNew) {
          campaignData.splice(session.index, 1);
        } else if (session.dirty) {
          restoreCampaignEditorState(session.snapshot, session.index);
        }
        currentCampaign = Math.max(0, Math.min(session.index, campaignData.length - 1));
      }
      editorSession = null;
    }

    function completeEditorClose() {
      const target = editorSession?.type === 'feature' ? 'library' : 'campaigns';
      discardEditorSession();
      switchTab(target);
    }

    function requestEditorClose() {
      if (editorSession?.type === 'feature') {
        openConfirm({
          badge: '取消编辑',
          title: '当前配置未保存，确认退出？',
          message: '退出后，本次在功能基础信息与引导形式中的配置不会保存。',
          impact: [
            editorSession.isNew ? '该新功能不会进入功能库' : '已有功能将保留最近一次保存的版本',
            '已发布及历史推送活动不会受到影响'
          ],
          actionLabel: '退出，不保存',
          onConfirm: completeEditorClose
        });
        return;
      }
      if (!editorSession || !editorSession.dirty) {
        completeEditorClose();
        return;
      }
      const isFeature = editorSession.type === 'feature';
      openConfirm({
        badge: '未保存修改',
        title: `放弃本次${isFeature ? '功能' : '活动'}编辑并退出？`,
        message: '当前修改尚未保存。确认退出后，本次编辑内容不会保留。',
        impact: [
          editorSession.isNew ? `未保存的${isFeature ? '新功能' : '新推送活动'}将不会出现在列表中` : '页面内容将恢复到最近一次保存的版本',
          '该操作不会影响已经发布的线上内容'
        ],
        actionLabel: '放弃修改并退出',
        onConfirm: completeEditorClose
      });
    }

    function switchTab(tab) {
      activeTab = tab;
      Object.entries(scenes).forEach(([key, scene]) =&gt; {
        scene.hidden = key !== tab;
      });
      root.querySelectorAll('.oa-module-tab[data-main-tab]').forEach(button =&gt; {
        const isActive = button.dataset.mainTab === tab;
        button.classList.toggle('is-active', isActive);
        button.setAttribute('aria-selected', String(isActive));
      });
      setPageContext(tab);
      if (tab === 'dashboard') renderDashboard();
      if (tab === 'library') renderFeatureLibrary();
      if (tab === 'campaigns') renderCampaigns();
      if (tab === 'overview') renderActivityOverview();
      if (tab === 'channels') renderChannel();
      if (tab === 'feature') renderFeatureEditor();
      if (tab === 'publish') renderPublishForm();
    }

    function renderPublishForm() {
      const campaign = campaignData[currentCampaign];
      syncCampaignSelectionState(campaign);
      root.querySelector('#oa-campaign-name').value = campaign.name;
      root.querySelector('#oa-campaign-owner').value = campaign.owner;
      root.querySelector('#oa-campaign-status').value = campaign.hasChanges &amp;&amp; campaign.status === 'live' ? '发布中 · 有待发布变更' : campaignStatusMeta[campaign.status][0];
      root.querySelector('#oa-campaign-start').value = campaign.start;
      root.querySelector('#oa-campaign-end').value = campaign.end;
      const selectedModuleCount = campaign.channelCount;
      const selectedItemCount = campaign.features.reduce((total, featureIndex) =&gt; {
        const feature = featureData[featureIndex];
        return total + (campaign.moduleSelections?.[feature?.key] || []).filter(Boolean).length;
      }, 0);
      const invalidSelectedFeatures = campaign.features.filter(featureIndex =&gt; {
        const feature = ensureFeatureMeta(featureData[featureIndex]);
        const selected = (campaign.moduleSelections?.[feature?.key] || []).some(Boolean);
        return selected &amp;&amp; (feature.status !== 'online' || feature.businessStatus !== 'active');
      });
      root.querySelector('#oa-publish-check-list').innerHTML = `
        &lt;li&gt;✓ 已选择 ${campaign.features.length} / 6 个功能&lt;/li&gt;
        &lt;li&gt;✓ 已组合 ${selectedModuleCount} 类引导，共 ${selectedItemCount} 个功能模块&lt;/li&gt;
        &lt;li&gt;✓ 所选模块均来自产品已确认的功能母版&lt;/li&gt;
        ${invalidSelectedFeatures.length ? `&lt;li class=&quot;text-destructive&quot;&gt;! ${invalidSelectedFeatures.map(index =&gt; featureData[index].name).join('、')} 当前不是线上状态&lt;/li&gt;` : '&lt;li&gt;✓ 所选产品功能当前均为线上状态&lt;/li&gt;'}
        &lt;li&gt;✓ 图片、视频比例与已配置的可选跳转动作校验通过&lt;/li&gt;
        &lt;li&gt;✓ 红点引导锚点与首次成功事件校验通过&lt;/li&gt;
        &lt;li&gt;✓ 活动人群、频控和冲突策略已配置&lt;/li&gt;
        ${selectedItemCount ? '' : '&lt;li class=&quot;text-destructive&quot;&gt;! 至少选择一个状态为“已完成”的引导形式&lt;/li&gt;'}
      `;
      root.querySelector('#oa-publish').disabled = selectedItemCount === 0 || invalidSelectedFeatures.length &gt; 0;
    }

    function renderActivityOverview() {
      const campaign = campaignData[currentCampaign];
      root.querySelector('#oa-overview-period').textContent = `${campaign.start} — ${campaign.end}`;
      renderCampaignFlow();
      renderMatrix();
    }

    function renderDashboard() {
      const liveCount = campaignData.filter(item =&gt; item.status === 'live').length;
      const scheduledCount = campaignData.filter(item =&gt; item.status === 'scheduled').length;
      const changeCount = campaignData.filter(item =&gt; item.hasChanges).length;
      root.querySelector('#oa-feature-total').textContent = `${featureData.length} 个`;
      root.querySelector('#oa-live-total').textContent = `${liveCount} 个活动`;
      root.querySelector('#oa-change-total').textContent = `${changeCount} 项`;
      root.querySelector('#oa-scheduled-total').textContent = `${scheduledCount} 个活动`;
      root.querySelector('#oa-dashboard-schedule').innerHTML = campaignData
        .filter(item =&gt; ['live', 'scheduled'].includes(item.status))
        .map((campaign, index) =&gt; {
          const realIndex = campaignData.indexOf(campaign);
          return `
            &lt;div class=&quot;oa-schedule-row&quot;&gt;
              &lt;span class=&quot;viz-badge&quot;&gt;${campaignStatusMeta[campaign.status][0]}&lt;/span&gt;
              &lt;div class=&quot;oa-table-primary&quot;&gt;&lt;strong&gt;${campaign.name}&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;${campaign.start} — ${campaign.end} · ${campaign.features.length} 个功能&lt;/span&gt;&lt;/div&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-open-campaign=&quot;${realIndex}&quot;&gt;管理&lt;/button&gt;
            &lt;/div&gt;`;
        }).join('');
      bindCampaignOpeners();
    }

    function renderFeatureLibrary() {
      const query = (root.querySelector('#oa-feature-search').value || '').trim().toLowerCase();
      const ownerFilter = root.querySelector('#oa-feature-owner-filter');
      const selectedOwner = ownerFilter.value || 'all';
      const owners = [...new Set(featureData.map(feature =&gt; feature.owner).filter(Boolean))];
      ownerFilter.innerHTML = `&lt;option value=&quot;all&quot;&gt;全部负责人&lt;/option&gt;${owners.map(owner =&gt; `&lt;option value=&quot;${owner}&quot;&gt;${owner}&lt;/option&gt;`).join('')}`;
      ownerFilter.value = owners.includes(selectedOwner) ? selectedOwner : 'all';
      const owner = ownerFilter.value;
      const rows = featureData.map((feature, index) =&gt; ({ feature, index })).filter(({ feature }) =&gt; {
        const matchesQuery = !query || `${feature.name} ${feature.key}`.toLowerCase().includes(query);
        return matchesQuery &amp;&amp; (owner === 'all' || feature.owner === owner);
      });
      root.querySelector('#oa-feature-library').innerHTML = rows.length ? rows.map(({ feature, index }) =&gt; {
        ensureFeatureMeta(feature);
        const refs = campaignRefs(index);
        const activeRefs = refs.filter(item =&gt; ['live', 'scheduled'].includes(item.status)).length;
        const selectedModules = guideTypeCatalog
          .map((item, moduleIndex) =&gt; ({ ...item, moduleIndex }))
          .filter(item =&gt; feature.selectedChannels[item.moduleIndex]);
        return `
          &lt;tr&gt;
            &lt;td&gt;&lt;div class=&quot;oa-table-primary&quot;&gt;&lt;strong&gt;${feature.name} &lt;span class=&quot;viz-badge&quot;&gt;V${feature.version}&lt;/span&gt;&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;${feature.key} · ${feature.intro}&lt;/span&gt;&lt;span class=&quot;text-muted&quot;&gt;产品状态：${featureStatusMeta[feature.status][0]}（自动同步）&lt;/span&gt;&lt;/div&gt;&lt;/td&gt;
            &lt;td class=&quot;${featureBusinessStatusMeta[feature.businessStatus][1]}&quot;&gt;&lt;span class=&quot;oa-status-dot&quot;&gt;&lt;/span&gt;${featureBusinessStatusMeta[feature.businessStatus][0]}&lt;/td&gt;
            &lt;td&gt;&lt;div class=&quot;oa-feature-chips&quot;&gt;${selectedModules.length ? selectedModules.map(item =&gt; {
              const state = getModuleState(feature, item.moduleIndex);
              return `&lt;span class=&quot;viz-badge ${moduleStatusMeta[state].className}&quot;&gt;${item.label} · ${moduleStatusMeta[state].label}&lt;/span&gt;`;
            }).join('') : '&lt;span class=&quot;text-muted&quot;&gt;未选择&lt;/span&gt;'}&lt;/div&gt;&lt;/td&gt;
            &lt;td&gt;${refs.length} 个活动${activeRefs ? ` · ${activeRefs} 个生效中` : ''}&lt;/td&gt;
            &lt;td&gt;${feature.owner}&lt;/td&gt;
            &lt;td&gt;${feature.updated}&lt;/td&gt;
            &lt;td&gt;&lt;div class=&quot;oa-table-actions&quot;&gt;
              &lt;button type=&quot;button&quot; class=&quot;oa-text-link&quot; data-library-edit=&quot;${index}&quot;&gt;编辑配置&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;oa-text-link ${feature.businessStatus === 'active' ? 'text-destructive' : ''}&quot; data-library-toggle-status=&quot;${index}&quot;&gt;${feature.businessStatus === 'active' ? '停用' : '恢复使用'}&lt;/button&gt;
              &lt;button type=&quot;button&quot; class=&quot;btn text-destructive&quot; data-library-delete=&quot;${index}&quot;&gt;删除&lt;/button&gt;
            &lt;/div&gt;&lt;/td&gt;
          &lt;/tr&gt;`;
      }).join('') : '&lt;tr&gt;&lt;td colspan=&quot;7&quot; class=&quot;text-muted text-center&quot;&gt;没有符合条件的功能&lt;/td&gt;&lt;/tr&gt;';

      root.querySelectorAll('[data-library-edit]').forEach(button =&gt; button.addEventListener('click', () =&gt; {
        selectedFeature = Number(button.dataset.libraryEdit);
        selectedFeatureModule = 0;
        featureEditorStep = 1;
        featureReviewMode = false;
        featurePreviewModule = null;
        beginEditorSession('feature', selectedFeature, false);
        switchTab('feature');
      }));
      root.querySelectorAll('[data-library-toggle-status]').forEach(button =&gt; button.addEventListener('click', () =&gt; {
        const index = Number(button.dataset.libraryToggleStatus);
        const feature = ensureFeatureMeta(featureData[index]);
        const willDisable = feature.businessStatus === 'active';
        const refs = featureReferenceSummary(index);
        openConfirm({
          badge: willDisable ? '停用功能母版' : '恢复使用',
          title: willDisable ? `停用“${feature.name}”功能母版？` : `恢复“${feature.name}”功能母版？`,
          message: willDisable
            ? '停用后不可被新活动选择；已有活动及历史快照继续保留，不改变产品线上功能状态。'
            : '恢复后，该母版可再次被新推送活动选择。',
          impact: willDisable
            ? [`进行中 ${refs.live.length} 个、已排期 ${refs.scheduled.length} 个活动不受影响`, '已结束活动继续冻结历史快照']
            : ['母版重新进入活动功能池', '产品线上状态仍由业务系统自动同步'],
          actionLabel: willDisable ? '确认停用' : '确认恢复使用',
          onConfirm: () =&gt; {
            feature.businessStatus = willDisable ? 'disabled' : 'active';
            feature.updated = '刚刚';
            feature.revisions.unshift(['刚刚', '当前产品经理', willDisable ? '功能母版已停用' : '功能母版已恢复使用']);
            renderFeatureLibrary();
            showToast(willDisable ? '功能母版已停用' : '功能母版已恢复使用');
          }
        });
      }));
      root.querySelectorAll('[data-library-delete]').forEach(button =&gt; button.addEventListener('click', () =&gt; requestFeatureDelete(Number(button.dataset.libraryDelete))));
    }

    function renderCampaigns() {
      const query = (root.querySelector('#oa-campaign-search').value || '').trim().toLowerCase();
      const status = root.querySelector('#oa-campaign-status-filter').value;
      const rows = campaignData.map((campaign, index) =&gt; ({ campaign, index })).filter(({ campaign }) =&gt; {
        return (!query || campaign.name.toLowerCase().includes(query)) &amp;&amp; (status === 'all' || campaign.status === status);
      });
      root.querySelector('#oa-campaign-list').innerHTML = rows.length ? rows.map(({ campaign, index }) =&gt; `
        &lt;tr&gt;
          &lt;td&gt;&lt;div class=&quot;oa-table-primary&quot;&gt;&lt;strong&gt;${campaign.name}&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;负责人 ${campaign.owner}${campaign.masterUpdated ? ' · 母版已更新，待重新确认' : campaign.hasChanges ? ' · 有待发布变更' : ''}&lt;/span&gt;&lt;/div&gt;&lt;/td&gt;
          &lt;td class=&quot;${campaignStatusMeta[campaign.status][1]}&quot;&gt;&lt;span class=&quot;oa-status-dot&quot;&gt;&lt;/span&gt;${campaignStatusMeta[campaign.status][0]}&lt;/td&gt;
          &lt;td&gt;${campaign.start}&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;至 ${campaign.end}&lt;/span&gt;&lt;/td&gt;
          &lt;td&gt;&lt;div class=&quot;oa-feature-chips&quot;&gt;${campaign.features.map(featureIndex =&gt; `&lt;span class=&quot;viz-badge&quot;&gt;${featureData[featureIndex]?.name || '已删除功能'}&lt;/span&gt;`).join('')}&lt;/div&gt;&lt;/td&gt;
          &lt;td&gt;${campaign.channelCount} 类引导&lt;/td&gt;
          &lt;td&gt;${campaign.updated}&lt;/td&gt;
          &lt;td&gt;&lt;div class=&quot;oa-table-actions&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;oa-text-link&quot; data-open-campaign=&quot;${index}&quot;&gt;${campaign.status === 'live' ? '变更方案' : campaign.status === 'ended' || campaign.status === 'offline' ? '查看' : '编辑'}&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;oa-text-link&quot; data-view-history=&quot;${index}&quot;&gt;查看记录&lt;/button&gt;
            ${campaign.status === 'live' || campaign.status === 'scheduled' ? `&lt;button type=&quot;button&quot; class=&quot;btn text-destructive&quot; data-offline-campaign=&quot;${index}&quot;&gt;${campaign.status === 'scheduled' ? '取消发布' : '立即下线'}&lt;/button&gt;` : ''}
            ${campaign.status === 'draft' ? `&lt;button type=&quot;button&quot; class=&quot;btn text-destructive&quot; data-delete-campaign=&quot;${index}&quot;&gt;删除&lt;/button&gt;` : ''}
          &lt;/div&gt;&lt;/td&gt;
        &lt;/tr&gt;
      `).join('') : '&lt;tr&gt;&lt;td colspan=&quot;7&quot; class=&quot;text-muted text-center&quot;&gt;没有符合条件的活动&lt;/td&gt;&lt;/tr&gt;';
      bindCampaignOpeners();
      root.querySelectorAll('[data-view-history]').forEach(button =&gt; button.addEventListener('click', () =&gt; renderCampaignHistory(Number(button.dataset.viewHistory))));
      root.querySelectorAll('[data-offline-campaign]').forEach(button =&gt; button.addEventListener('click', () =&gt; requestCampaignOffline(Number(button.dataset.offlineCampaign))));
      root.querySelectorAll('[data-delete-campaign]').forEach(button =&gt; button.addEventListener('click', () =&gt; requestCampaignDelete(Number(button.dataset.deleteCampaign))));
      renderCampaignHistory(currentCampaign);
    }

    function renderCampaignHistory(index) {
      currentCampaign = Math.min(index, campaignData.length - 1);
      const campaign = campaignData[currentCampaign];
      root.querySelector('#oa-history-title').textContent = `${campaign.name} · 变更记录`;
      root.querySelector('#oa-history-list').innerHTML = campaign.revisions.map((item, revisionIndex) =&gt; `
        &lt;div class=&quot;oa-history-row&quot;&gt;
          &lt;span class=&quot;viz-badge&quot;&gt;${revisionIndex === 0 ? '最新' : `v${campaign.revisions.length - revisionIndex}.0`}&lt;/span&gt;
          &lt;div class=&quot;oa-table-primary&quot;&gt;&lt;strong&gt;${item[2]}&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;${item[0]} · ${item[1]}&lt;/span&gt;&lt;/div&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-open-campaign=&quot;${currentCampaign}&quot;&gt;查看该活动&lt;/button&gt;
        &lt;/div&gt;`).join('');
      bindCampaignOpeners();
    }

    function bindCampaignOpeners() {
      root.querySelectorAll('[data-open-campaign]').forEach(button =&gt; {
        button.addEventListener('click', () =&gt; openCampaign(Number(button.dataset.openCampaign)));
      });
    }

    function openCampaign(index, isNew = false) {
      currentCampaign = index;
      const campaign = campaignData[index];
      ensureCampaignModuleSelections(campaign);
      syncCampaignSelectionState(campaign);
      beginEditorSession('campaign', index, isNew);
      renderPublishForm();
      switchTab('overview');
    }

    function createCampaign() {
      campaignData.unshift({
        name: '未命名功能引导活动',
        status: 'draft',
        start: '2026-09-01 10:00',
        end: '2026-09-30 23:59',
        features: [0],
        channelCount: 2,
        owner: '当前管理员',
        updated: '刚刚',
        hasChanges: false,
        revisions: [['刚刚', '当前管理员', '创建活动草稿']]
      });
      openCampaign(0, true);
      showToast('已进入新建活动，尚未保存');
    }

    function createFeature() {
      featureData.unshift({
        key: `new-feature-${featureData.length + 1}`,
        name: '未命名引导功能',
        intro: '请输入功能简介，并分别配置需要发布的引导模块。',
        status: 'draft',
        owner: '当前产品经理',
        updated: '刚刚',
        channels: [0, 0, 0, 0],
        selectedChannels: [0, 0, 0, 0],
        moduleStates: ['pending', 'pending', 'pending', 'pending'],
        event: 'new_feature.first_success',
        version: 0,
        confirmed: false,
        businessStatus: 'creating',
        revisions: []
      });
      campaignData.forEach(campaign =&gt; {
        campaign.features = campaign.features.map(index =&gt; index + 1);
      });
      channelSelections.home = channelSelections.home.map(index =&gt; index + 1);
      channelSelections.canvas = channelSelections.canvas.map(index =&gt; index + 1);
      selectedFeature = 0;
      selectedFeatureModule = 0;
      featureEditorStep = 1;
      featureReviewMode = false;
      featurePreviewModule = null;
      beginEditorSession('feature', selectedFeature, true);
      switchTab('feature');
      showToast('已进入新建功能，尚未保存');
    }

    function openConfirm(config) {
      confirmAction = config.onConfirm;
      root.querySelector('#oa-confirm-badge').textContent = config.badge || '请确认';
      root.querySelector('#oa-confirm-title').textContent = config.title;
      root.querySelector('#oa-confirm-message').textContent = config.message;
      root.querySelector('#oa-confirm-impact').innerHTML = (config.impact || []).map(item =&gt; `&lt;div&gt;• ${item}&lt;/div&gt;`).join('');
      root.querySelector('#oa-run-confirm').textContent = config.actionLabel || '确认';
      root.querySelector('#oa-confirm').hidden = false;
    }

    function closeConfirm() {
      confirmAction = null;
      root.querySelector('#oa-confirm').hidden = true;
    }

    function requestFeatureDelete(index) {
      const feature = featureData[index];
      const refs = campaignRefs(index);
      if (refs.length) {
        openConfirm({
          badge: '无法删除',
          title: `“${feature.name}”仍被 ${refs.length} 个活动引用`,
          message: '为保证历史活动可追溯，已被活动引用的引导配置不可删除。如需停止触达，请变更或下线对应推送活动；产品功能状态由线上系统自动同步。',
          impact: refs.map(item =&gt; item.name),
          actionLabel: '知道了',
          onConfirm: closeConfirm
        });
        return;
      }
      openConfirm({
        badge: '删除功能',
        title: `永久删除“${feature.name}”？`,
        message: '仅未被任何活动引用的引导配置可以删除，删除后不可恢复。',
        impact: ['引导内容、主图、动作配置将被移除', '不会删除或改变产品线上功能'],
        actionLabel: '确认删除',
        onConfirm: () =&gt; {
          featureData.splice(index, 1);
          campaignData.forEach(campaign =&gt; {
            campaign.features = campaign.features.map(featureIndex =&gt; featureIndex &gt; index ? featureIndex - 1 : featureIndex);
          });
          channelSelections.home = channelSelections.home.map(featureIndex =&gt; featureIndex &gt; index ? featureIndex - 1 : featureIndex);
          channelSelections.canvas = channelSelections.canvas.map(featureIndex =&gt; featureIndex &gt; index ? featureIndex - 1 : featureIndex);
          selectedFeature = Math.max(0, Math.min(selectedFeature, featureData.length - 1));
          renderFeatureLibrary();
          showToast('功能已删除');
        }
      });
    }

    function requestCampaignOffline(index) {
      const campaign = campaignData[index];
      openConfirm({
        badge: campaign.status === 'scheduled' ? '取消发布' : '立即下线',
        title: `${campaign.status === 'scheduled' ? '取消' : '下线'}“${campaign.name}”？`,
        message: campaign.status === 'scheduled' ? '取消后活动回到草稿状态，可修改后重新排期。' : '确认后所有触达会立即停止，用户不再看到首页弹窗、画布卡片和 NEW 标记；历史数据与版本记录继续保留。',
        impact: campaign.features.map(featureIndex =&gt; `停止触达：${featureData[featureIndex]?.name || '历史功能'}`),
        actionLabel: campaign.status === 'scheduled' ? '确认取消' : '确认立即下线',
        onConfirm: () =&gt; {
          campaign.status = campaign.status === 'scheduled' ? 'draft' : 'offline';
          campaign.updated = '刚刚';
          campaign.revisions.unshift(['刚刚', '当前管理员', campaign.status === 'draft' ? '取消排期，活动回到草稿' : '手动下线活动']);
          renderCampaigns();
          showToast(campaign.status === 'draft' ? '已取消发布排期' : '活动已下线');
        }
      });
    }

    function requestCampaignDelete(index) {
      const campaign = campaignData[index];
      openConfirm({
        badge: '删除草稿',
        title: `删除“${campaign.name}”？`,
        message: '仅从未发布的草稿活动可以删除。功能库内容不会受到影响。',
        impact: [`将移除 ${campaign.features.length} 个已选功能的活动配置`, '活动草稿与编辑记录将被删除'],
        actionLabel: '确认删除',
        onConfirm: () =&gt; {
          campaignData.splice(index, 1);
          currentCampaign = 0;
          renderCampaigns();
          showToast('活动草稿已删除');
        }
      });
    }

    const releaseModuleMeta = [
      { key: 'home', title: '功能推送', stage: '首页曝光', description: '更新弹窗承载1—6个功能' },
      { key: 'guide', title: '功能指南', stage: '深入了解', description: '图文或视频完整解释能力' },
      { key: 'canvas', title: '画布引导', stage: '进入创作', description: '画布卡片承接开始使用' },
      { key: 'markers', title: '红点引导', stage: '到达入口', description: '红点或NEW定位真实功能' }
    ];

    function ensureCampaignModuleSelections(campaign) {
      campaign.moduleSelections = campaign.moduleSelections || {};
      const defaultModuleIndexes = releaseModuleMeta.map((_, index) =&gt; index).slice(0, Math.max(1, campaign.channelCount || 1));
      campaign.features.forEach(featureIndex =&gt; {
        const feature = featureData[featureIndex];
        if (!feature || campaign.moduleSelections[feature.key]) return;
        campaign.moduleSelections[feature.key] = feature.channels.map((_, moduleIndex) =&gt; Boolean(getModuleState(feature, moduleIndex) === 'completed' &amp;&amp; defaultModuleIndexes.includes(moduleIndex)));
      });
      return campaign.moduleSelections;
    }

    function syncCampaignSelectionState(campaign) {
      const selections = ensureCampaignModuleSelections(campaign);
      const selectedForModule = moduleIndex =&gt; campaign.features.filter(featureIndex =&gt; {
        const feature = featureData[featureIndex];
        return Boolean(feature &amp;&amp; selections[feature.key]?.[moduleIndex]);
      });
      channelSelections.home = selectedForModule(0);
      channelSelections.canvas = selectedForModule(2);
      campaign.channelCount = releaseModuleMeta.filter((_, moduleIndex) =&gt; selectedForModule(moduleIndex).length &gt; 0).length;
    }

    function selectedFeaturesForModule(moduleIndex) {
      const campaign = campaignData[currentCampaign];
      const selections = ensureCampaignModuleSelections(campaign);
      return campaign.features.filter(featureIndex =&gt; {
        const feature = featureData[featureIndex];
        return Boolean(feature &amp;&amp; selections[feature.key]?.[moduleIndex]);
      });
    }

    function renderCampaignFlow() {
      const campaign = campaignData[currentCampaign];
      syncCampaignSelectionState(campaign);
      const selectedModules = releaseModuleMeta.map((module, moduleIndex) =&gt; ({
        ...module,
        features: selectedFeaturesForModule(moduleIndex)
      })).filter(module =&gt; module.features.length);
      root.querySelector('#oa-combination-count').textContent = `${selectedModules.length} 类引导`;
      root.querySelector('#oa-flow-title').textContent = selectedModules.length ? `本次发布组合 · ${selectedModules.length} 类引导` : '尚未选择发布组合';
      const leadFeature = featureData[campaign.features[0]];
      const nodes = selectedModules.map((module, index) =&gt; `
        &lt;div class=&quot;oa-flow-node&quot;&gt;
          &lt;span class=&quot;viz-badge&quot;&gt;${String(index + 1).padStart(2, '0')} ${module.stage}&lt;/span&gt;
          &lt;strong&gt;${module.title}&lt;/strong&gt;
          &lt;span class=&quot;text-muted&quot;&gt;${module.features.length} 个功能 · ${module.description}&lt;/span&gt;
        &lt;/div&gt;
        ${index &lt; selectedModules.length - 1 ? '&lt;span class=&quot;oa-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;' : ''}
      `).join('');
      root.querySelector('#oa-campaign-flow').innerHTML = selectedModules.length ? `
        ${nodes}
        &lt;span class=&quot;oa-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/span&gt;
        &lt;div class=&quot;oa-success-node&quot;&gt;
          &lt;span class=&quot;oa-success-dot&quot; aria-hidden=&quot;true&quot;&gt;✓&lt;/span&gt;
          &lt;strong&gt;首次成功&lt;/strong&gt;
          &lt;span class=&quot;text-muted&quot;&gt;收到 ${leadFeature?.event || '成功事件'} 后停止该功能剩余触达&lt;/span&gt;
        &lt;/div&gt;` : '&lt;div class=&quot;text-muted&quot;&gt;请在下方矩阵中至少选择一个状态为“已完成”的引导形式。&lt;/div&gt;';
    }

    function renderMatrix() {
      const campaign = campaignData[currentCampaign];
      const selections = ensureCampaignModuleSelections(campaign);
      root.querySelector('#oa-feature-matrix').innerHTML = campaign.features.map((index) =&gt; {
        const feature = featureData[index];
        const selectedModules = selections[feature.key] || [false, false, false, false];
        return `
        &lt;tr&gt;
          &lt;td&gt;&lt;strong&gt;${feature.name}&lt;/strong&gt; ${feature.status === 'offline' ? '&lt;span class=&quot;viz-badge&quot;&gt;产品已下线&lt;/span&gt;' : ''}&lt;/td&gt;
          ${feature.channels.map((_, moduleIndex) =&gt; {
            const state = getModuleState(feature, moduleIndex);
            const ready = state === 'completed';
            return `
            &lt;td class=&quot;text-center&quot;&gt;
              &lt;label class=&quot;oa-module-check&quot; title=&quot;${ready ? '该引导形式配置完整' : `${moduleStatusMeta[state].label}，不可加入活动`}&quot;&gt;
                &lt;input type=&quot;checkbox&quot; data-module-select=&quot;${feature.key}&quot; data-module-index=&quot;${moduleIndex}&quot; ${selectedModules[moduleIndex] ? 'checked' : ''} ${!ready || feature.status !== 'online' || feature.businessStatus !== 'active' ? 'disabled' : ''}&gt;
                &lt;span&gt;${moduleStatusMeta[state].label}&lt;/span&gt;
              &lt;/label&gt;
            &lt;/td&gt;`;
          }).join('')}
          &lt;td&gt;&lt;code&gt;${feature.event}&lt;/code&gt;&lt;/td&gt;
        &lt;/tr&gt;
      `}).join('');

      root.querySelectorAll('[data-module-select]').forEach(input =&gt; {
        input.addEventListener('change', () =&gt; {
          const featureKey = input.dataset.moduleSelect;
          const moduleIndex = Number(input.dataset.moduleIndex);
          ensureCampaignModuleSelections(campaign)[featureKey][moduleIndex] = input.checked;
          campaign.hasChanges = campaign.status === 'live' || campaign.hasChanges;
          campaign.updated = '刚刚';
          markEditorDirty('campaign');
          syncCampaignSelectionState(campaign);
          renderCampaignFlow();
          setPageContext(activeTab);
          showToast(input.checked ? '已加入本次发布组合' : '已从本次发布组合移除');
        });
      });
    }

    function updateFeatureCharCounter(input) {
      const counter = root.querySelector(`[data-char-count=&quot;${input.id}&quot;]`);
      if (!counter) return;
      counter.textContent = `${input.value.length}/${input.maxLength}`;
    }

    function renderFeatureEditor() {
      const feature = ensureFeatureMeta(featureData[selectedFeature]);
      const isNewFeature = Boolean(editorSession?.type === 'feature' &amp;&amp; editorSession.isNew);
      root.querySelector('#oa-feature-step-one-title').textContent = isNewFeature ? '填写功能信息' : '编辑功能信息';
      root.querySelector('#oa-feature-step-two-title').textContent = isNewFeature ? '选择并配置引导形式' : '修改引导配置';
      root.querySelector('#oa-feature-step-two-copy').textContent = isNewFeature ? '逐一完成配置后预览并确认' : '一次预览变更并保存同步';
      root.querySelector('#oa-feature-name').value = feature.name;
      root.querySelector('#oa-feature-intro').value = feature.intro;
      updateFeatureCharCounter(root.querySelector('#oa-feature-name'));
      updateFeatureCharCounter(root.querySelector('#oa-feature-intro'));
      root.querySelector('#oa-feature-key').value = feature.key;
      root.querySelector('#oa-feature-status').value = feature.status === 'draft'
        ? '未同步 · 等待功能标识匹配'
        : `${featureStatusMeta[feature.status][0]} · 产品线上状态`;
      root.querySelector('#oa-feature-owner').value = feature.owner;
      root.querySelector('#oa-feature-event').innerHTML = `&lt;option&gt;${feature.event}&lt;/option&gt;&lt;option&gt;自定义埋点事件&lt;/option&gt;`;
      root.querySelector('#oa-feature-version-badge').textContent = feature.confirmed ? `可使用 · 母版 V${feature.version}` : '创建中';
      root.querySelector('#oa-feature-version-side').textContent = feature.confirmed ? `可使用 · V${feature.version}` : '创建中 · 未确认';
      const references = featureReferenceSummary(selectedFeature);
      root.querySelector('#oa-sync-rule-list').innerHTML = `
        &lt;div class=&quot;oa-sync-rule-row&quot;&gt;&lt;strong&gt;编辑中 · ${references.editing.length}&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;确认母版后自动同步最新版本&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;oa-sync-rule-row&quot;&gt;&lt;strong&gt;已排期 · ${references.scheduled.length}&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;自动同步，并标记“母版已更新”待重新确认&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;oa-sync-rule-row&quot;&gt;&lt;strong&gt;进行中 · ${references.live.length}&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;默认锁定活动当前版本，由管理员决定是否应用更新&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;oa-sync-rule-row&quot;&gt;&lt;strong&gt;已结束 · ${references.frozen.length}&lt;/strong&gt;&lt;span class=&quot;text-muted&quot;&gt;永久冻结发布快照，不再跟随母版变化&lt;/span&gt;&lt;/div&gt;
      `;
      root.querySelector('#oa-reuse-list').innerHTML = campaignRefs(selectedFeature).length ? campaignRefs(selectedFeature).map((campaign) =&gt; `
        &lt;div class=&quot;oa-reuse-row&quot;&gt;
          &lt;span&gt;${campaign.name}&lt;/span&gt;
          &lt;span class=&quot;viz-badge&quot;&gt;${campaignStatusMeta[campaign.status][0]} · ${['ended', 'offline'].includes(campaign.status) ? `冻结 V${feature.version}` : campaign.status === 'live' ? `锁定 V${feature.version}` : `跟随 V${feature.version}`}&lt;/span&gt;
        &lt;/div&gt;
      `).join('') : '&lt;span class=&quot;text-muted&quot;&gt;暂未被任何推送活动引用&lt;/span&gt;';
      renderFeatureStep();
      setPageContext('feature');
    }

    function renderFeatureStep() {
      const feature = ensureFeatureMeta(featureData[selectedFeature]);
      featureEditorStep = 2;
      root.querySelector('.oa-feature-workbench').classList.toggle('is-reviewing', featureReviewMode);
      root.querySelector('#oa-feature-base-panel').hidden = featureReviewMode;
      root.querySelector('#oa-feature-guide-panel').hidden = false;
      root.querySelector('#oa-feature-back-step').hidden = true;
      root.querySelector('#oa-feature-next-step').hidden = true;
      root.querySelector('#oa-preview-feature').hidden = true;
      root.querySelector('#oa-save-feature').hidden = false;
      root.querySelectorAll('[data-feature-step]').forEach(button =&gt; {
        const step = Number(button.dataset.featureStep);
        button.classList.toggle('is-active', step === 2);
        button.classList.toggle('is-complete', step === 1);
      });
      renderFeatureModules();
      const selectedIndexes = feature.selectedChannels
        .map((selected, index) =&gt; selected ? index : -1)
        .filter(index =&gt; index &gt;= 0);
      root.querySelector('#oa-save-feature').disabled = !selectedIndexes.length;
      root.querySelector('#oa-save-feature').textContent = featureReviewMode ? '确认保存' : '保存';
    }

    function optionalActionForm(config, moduleIndex) {

      return `
        &lt;section class=&quot;oa-optional-action ${enabled ? 'is-enabled' : ''}&quot;&gt;

            ${enabled

    function featureModuleForm(feature, moduleIndex) {
